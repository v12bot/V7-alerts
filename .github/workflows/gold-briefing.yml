# 2026-11-09: winter-time crons only - summer entries removed (scheduler fix). Staggered +7 min off the quarter-hour per GitHub's guidance — schedule is best-effort under load Wed swing slot removed - no separate swing day; swings run with the scalp monitor.
# Gold briefing - ONE file. Paste this whole file into your repo at
# .github/workflows/gold-briefing.yml. The Python lives inside it.
#
# What it sends: a short ntfy card on weekday mornings after the 08:00-08:15
# ET opening range - prior trading day, Asia, London, ORB range, session
# VWAP, sorted by price with the distance from the current price. Plus a
# Sunday week-open card with the last full session's levels and a 4H swing
# section, and a Wednesday midday swing check (4H setups, held days/weeks).
# At most 1 swing setup per send, so Sunday + Wednesday caps at 2/week.
# Set the SWING_ALERTS repo variable to 0 to switch the swing section off.
# Plus a 15-minute monitor on weekday NY sessions (07:37-16:07 ET): the
# card is re-checked and only re-sent when EXECUTE, PREPARE or WATCH
# changed (state in gold-state.json).
#
# Winter-time crons only as of Nov 9, 2026.
# Summer entries removed to fix the scheduler not firing;
# restore them when daylight saving returns in March 2027.
name: Gold briefing

permissions:
  contents: write

on:
  schedule:
    - cron: "25 13 * * 1-5"   # NY briefing, 8:25 ET in winter time
    - cron: "5 23 * * 0"      # Sunday open, 6:05 PM ET in winter time
    # 15-min monitor, weekday NY session 07:37-16:07 ET. The script only
    # sends when EXECUTE, PREPARE or WATCH changed (state in gold-state.json).
    - cron: "37,52 12 * * 1-5"  # monitor, winter time (07:37/07:52 ET)
    - cron: "7,22,37,52 13-20 * * 1-5"  # monitor, winter time (08:07-15:52 ET)
    - cron: "7 21 * * 1-5"      # monitor, winter time (16:07 ET)
  workflow_dispatch:
    inputs:
      mode:
        description: "briefing, feedcheck, selftest or scorecard"
        default: "briefing"
      force:
        description: "1 = send now, ignore the time window"
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TradeLocker library (only if demo secrets are set)
        env:
          TRADELOCKER_DEMO_SERVER: ${{ secrets.TRADELOCKER_DEMO_SERVER }}
        run: |
          if [ -n "$TRADELOCKER_DEMO_SERVER" ]; then
            pip install tradelocker || echo "tradelocker install failed, continuing without it"
          fi
      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TRADELOCKER_DEMO_EMAIL: ${{ secrets.TRADELOCKER_DEMO_EMAIL }}
          TRADELOCKER_DEMO_PASSWORD: ${{ secrets.TRADELOCKER_DEMO_PASSWORD }}
          TRADELOCKER_DEMO_SERVER: ${{ secrets.TRADELOCKER_DEMO_SERVER }}
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET }}
          ROOM_BASIS: ${{ vars.ROOM_BASIS }}
          SWING_ALERTS: ${{ vars.SWING_ALERTS }}
          MODE: ${{ github.event.inputs.mode || 'briefing' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: |
          python - <<'PYEOF'
          #!/usr/bin/env python3
          """
          Gold scalp briefing -> ntfy: the "GOLD SCALPS NY" card (all day while gold is
          open), the "GOLD WEEK OPEN" Sunday card and the all-day "GOLD SWING" alert.
          
          Card: NOW + trend context, then three decisions - EXECUTE (best qualified
          setup), PREPARE and WATCH (the next two developing setups) - the TradingView
          ALERTS for them, and the key levels. Prices are chart prices (feed + offset).
          
          Rules in force (Nov 2026)
          - TRADE = score >= 3/5 and room >= 1R (room measured per ROOM_BASIS: last
            target by default, "tp2" / "tp1" are stricter). Score = room (>= 2R: 2, >= 1R: 1) +
            volume spike + VWAP agrees + MACD agrees; against the W/D/1H trend loses a
            point. Scalp setups also need VWAP or MACD to agree (zone and VWAP BREAK
            setups are his own method and are exempt).
          - Stop = max(15m ATR, 10) pts, skipped when ATR > 15. Zones: stop at the zone
            edge +/- 3, risk 10-15. The card shows R and points only, never dollars.
          - TPs: the successive levels ahead (>= 3 pts apart, within MAX_TP_R of entry),
            up to 4; the SELL / BUY ZONE entries count as levels, so a TP never sits
            inside an opposing zone.
          - ORB setups are built only until ORB_LAST_HOUR_ET (12:00 ET); the ORB H / L
            levels stay on as TP levels (Nov 11 2026).
          - Setups that wait for a 15m close (ORB, zones, VWAP BREAK, retests) say WAIT
            FOR CLOSE and carry a max-chase limit. LIQZONE entries are already triggered.
          - Alerts: at most 3, only within 15 pts of price, none for an entry price is
            already at, NO SHORTS / NO LONGS only when 5+ pts from its entry. Each alert
            line carries its setup score; qualified setups are listed first.
          - Zones: nearest 4H / daily swings within 60 pts (broken or not), paired when
            within 20. VWAP is anchored at the most recent 18:00 ET.
          - News: high-impact USD events (weekly calendar) print a warning from 30 min
            before to 15 min after. Fail-open: a failed fetch prints "news calendar
            unavailable". NEWS_FILTER=0 switches it off.
          - Outcome log (paper, no orders are placed): every EXECUTE card and every
            listed alert is logged in gold-state.json and closed out from the later
            15m candles. Breakouts (ORB, VWAP BREAK) trigger on a 15m close beyond the
            entry; zone / retest setups on a touch and a close back; LIQZONE is filled
            at once. The fill is the close of the trigger candle, so a close past the
            max-chase limit is "skipped". A candle that touches both stop and target
            counts as a stop. MODE=outcomes sends the summary by setup type.
          - Feeds in order: TradeLocker demo, OANDA, then labelled fallbacks (Binance,
            Bybit, PAXG), tried only when no earlier feed is fresh. The offset is per
            feed; the card prints the sample time, raw price and offset. A feed whose
            newest candle closed more than 30 min ago is skipped.
          - Swing section (Sunday card, all-day GOLD SWING alert): 4H retest setups,
            stop max(4H ATR, 30) capped at 60, same gate as the scalp card. Sunday has
            no ORB and no VWAP BREAK.
          
          Modes (MODE env var): briefing (default), feedcheck, selftest, scorecard, outcomes.
          NY runs send only when EXECUTE, PREPARE, WATCH or the news warning changed
          (state in gold-state.json); forced runs always send.
          Secrets: NTFY_TOPIC (required, treat it like a password), OANDA_API_TOKEN,
          TRADELOCKER_DEMO_EMAIL / PASSWORD / SERVER (optional, demo only, never live).
          Repo variables: PRICE_OFFSET (chart price minus OANDA price), PRICE_OFFSET_DATE
          (YYYY-MM-DD it was last checked; the card warns after 7 days),
          PRICE_OFFSET_FALLBACK, SWING_ALERTS (0 = swing alerts off), NEWS_FILTER.
          """
          import json
          import os
          import sys
          import time as _time
          import urllib.request
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo
          
          ET = ZoneInfo("America/New_York")
          
          # ============================ SETTINGS ============================
          NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "").strip()
          NTFY_SERVER = os.environ.get("NTFY_SERVER", "https://ntfy.sh").strip().rstrip("/")
          NTFY_TOKEN = os.environ.get("NTFY_TOKEN", "").strip()
          
          # Added to every feed price so levels match your chart. Run feedcheck mode,
          # compare with your chart, then set this as a repo variable.
          PRICE_OFFSET = float(os.environ.get("PRICE_OFFSET", "0.0") or 0.0)
          # PRICE_OFFSET is calibrated for ONE feed (OANDA). briefing() rewrites the
          # PRICE_OFFSET global each run with _offset_for(), so BASE_OFFSET keeps the
          # configured value. Fallback feeds sit at other distances from the chart
          # (PAXG ran ~13 pts under OANDA on Nov 9 2026), so they get their own
          # optional PRICE_OFFSET_FALLBACK; unset = reuse PRICE_OFFSET and flag it.
          BASE_OFFSET = PRICE_OFFSET
          # Optional repo variable: the date (YYYY-MM-DD) the offset was last checked
          # with feedcheck. The card warns once it is older than OFFSET_MAX_AGE_DAYS.
          OFFSET_DATE = os.environ.get("PRICE_OFFSET_DATE", "").strip()
          OFFSET_MAX_AGE_DAYS = 7
          _fb_raw = os.environ.get("PRICE_OFFSET_FALLBACK", "").strip()
          PRICE_OFFSET_FALLBACK = float(_fb_raw) if _fb_raw else None
          
          # No alert repeats: the card is sent once. Repeating a line did
          # not make the phone beep for 3-5 seconds — the notification sound length
          # is the phone's sound file, not something the script controls. If a
          # longer alert sound is wanted, set a longer notification sound in the
          # ntfy app on the phone.
          # ORB filter (range of the first 15m candle after 8:00 ET, in points)
          ORB_MIN_RANGE = 4.0
          ORB_MAX_RANGE = 15.0
          # ORB LONG / SHORT setups are only built until this hour (ET) of the same
          # morning (Nov 11 2026). Before, the 08:00 candle's breakout stayed a live
          # setup until 03:00 the next night.
          ORB_LAST_HOUR_ET = 12
          
          # A trading day starts at this hour (ET). Gold reopens at 18:00 ET.
          DAY_START_HOUR_ET = 18
          
          # When a scheduled run may send (minutes after midnight, ET). GitHub can
          # delay scheduled runs, so the windows are wide - but they must stay clear
          # of the wrong-season cron (07:25 / 09:25 ET and 17:05 / 19:05 ET Sunday).
          # Nov 8 2026: the scalp card and the swing check now run whenever gold is
          # open (market_open below), not in fixed windows. Only the Sunday week-open
          # card keeps a window. SWING_WINDOW is used only by manual FORCE runs.
          SUNDAY_WINDOW = (17 * 60 + 35, 18 * 60 + 35)
          SWING_WINDOW = (12 * 60, 12 * 60 + 30)
          # Swing alerts on/off: set SWING_ALERTS=0 (env var or repo variable) to
          # switch the twice-weekly swing section off entirely.
          SWING_ALERTS = os.environ.get("SWING_ALERTS", "1").strip() != "0"
          # Swing stop (backtest): max(4H ATR, 30); skip the trade if 4H ATR > 60.
          SWING_STOP_FLOOR = 30.0
          SWING_STOP_CAP = 60.0
          
          # Price within this many points of an entry = already AT the entry: the card
          # says so and no alert is listed (an alert would fire instantly / never help).
          AT_ENTRY_PTS = 2.0
          # An alert is only listed when its trigger is within this many points of
          # price (Nov 8 2026): farther levels stay as PREPARE/WATCH with no alert,
          # so the 3 TradingView slots are never spent on levels price cannot reach.
          ALERT_MAX_DIST = 15.0
          # A NO SHORTS / NO LONGS alert is only listed when it is at least this far
          # from its own entry alert (otherwise it just doubles the same level).
          INVAL_MIN_GAP = 5.0
          # Key levels farther than this from price are left off the card (the
          # weekly/daily swings still print on the W/D line).
          KEY_LEVEL_REACH = 60.0
          # Zone candidates: 4H / daily swings (broken or not) within this many
          # points of price, and a zone pairs two levels only if they are this close.
          ZONE_LEVEL_SPAN = 60.0
          ZONE_PAIR_MAX = 20.0
          # A liquidity-sweep entry older than this many 15m bars is history, not a signal.
          MAX_SIGNAL_AGE_BARS = 8
          # Targets farther than this many R from the entry are not scalp targets: they
          # stay off the TP ladder so a distant level (the weekly low) cannot inflate
          # the room score.
          MAX_TP_R = 6.0
          # Which target the ROOM score is measured to (Nov 11 2026). "last" = the last
          # target shown (the original rule: a far 4th TP can earn the room points even
          # when TP1 is under 1R). "tp2" = the 2nd target (one real step beyond TP1).
          # "tp1" = the 1st target only (strictest). With a single target all three
          # agree. Default "last" = no change to the tested rules; "tp2" is stricter
          # (it drops the Monday self-test LIQZONE from 3/5 to 2/5). Set ROOM_BASIS as
          # an env / repo variable (needs a line in the workflow) or edit the default.
          ROOM_BASIS = os.environ.get("ROOM_BASIS", "last").strip().lower() or "last"
          # A setup that waits for a 15m close can fill past its level. The card gives a
          # max-chase limit: at most this many points, never past the 15-pt stop cap.
          MAX_CHASE_PTS = 3.0
          MAX_STOP_PTS = 15.0
          # High-impact news (no entries until 15 min after): weekly calendar JSON,
          # checked at most every NEWS_CACHE_MIN minutes. The warning runs from
          # NEWS_BEFORE_MIN before the release to NEWS_AFTER_MIN after it.
          NEWS_FILTER = os.environ.get("NEWS_FILTER", "1").strip() != "0"
          NEWS_URL = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          NEWS_COUNTRY = "USD"
          NEWS_IMPACTS = ("High",)
          NEWS_BEFORE_MIN = 30
          NEWS_AFTER_MIN = 15
          NEWS_CACHE_MIN = 180
          NEWS_RETRY_MIN = 30   # wait this long after a failed fetch before retrying
          
          MIN_CANDLES = 150
          CANDLE_MS = 15 * 60 * 1000
          STALE_MINUTES_NY = 30  # newest complete candle must be this fresh (NY only)
          
          OANDA_API_TOKEN = os.environ.get("OANDA_API_TOKEN", "").strip()
          OANDA_HOST = "https://api-fxpractice.oanda.com"
          TL_EMAIL = os.environ.get("TRADELOCKER_DEMO_EMAIL", "").strip()
          TL_PASSWORD = os.environ.get("TRADELOCKER_DEMO_PASSWORD", "").strip()
          TL_SERVER = os.environ.get("TRADELOCKER_DEMO_SERVER", "").strip()
          
          MODE = os.environ.get("MODE", "briefing").strip().lower() or "briefing"
          FORCE = os.environ.get("FORCE", "0").strip() == "1"
          
          
          # ============================ DATA ============================
          def http_get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "gold-briefing/1.0"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode("utf-8"))
          
          
          def _parse_oanda_time(s):
              """OANDA timestamps carry 9-digit fractions; trim to 6 for fromisoformat."""
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              if "." in s:
                  head, rest = s.split(".", 1)
                  frac, off = "", ""
                  for i, ch in enumerate(rest):
                      if ch in "+-":
                          off, frac = rest[i:], rest[:i]
                          break
                  else:
                      frac = rest
                  frac = (frac + "000000")[:6]
                  s = head + "." + frac + off
              return datetime.fromisoformat(s)
          
          
          def fetch_oanda():
              """XAU/USD M15 mid candles from OANDA practice. Returns (candles, live, err).
              price=MBA also returns bid and ask; the forming candle's bid/ask close is
              kept in fetch_oanda.quote for feedcheck (candles themselves stay mid)."""
              fetch_oanda.quote = None
              url = (f"{OANDA_HOST}/v3/instruments/XAU_USD/candles"
                     "?granularity=M15&count=500&price=MBA")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {OANDA_API_TOKEN}",
                  "Accept": "application/json",
              })
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.load(resp)
              candles, live = [], None
              for c in data.get("candles", []):
                  mid = c.get("mid", {})
                  t_ms = int(_parse_oanda_time(c["time"]).timestamp() * 1000)
                  if c.get("complete"):
                      candles.append({
                          "t": t_ms, "o": float(mid["o"]), "h": float(mid["h"]),
                          "l": float(mid["l"]), "c": float(mid["c"]),
                          "v": float(c.get("volume", 0)),
                      })
                  else:
                      live = float(mid["c"])  # forming candle: nearest thing to live
                      try:
                          fetch_oanda.quote = (float(c["bid"]["c"]), float(c["ask"]["c"]))
                      except (KeyError, TypeError, ValueError):
                          fetch_oanda.quote = None
              return candles, live, None
          
          
          def fetch_binance(url):
              """Binance klines (perp or spot). Returns (candles, live, err)."""
              data = http_get(url)
              if isinstance(data, dict):
                  return None, None, str(data.get("msg") or data.get("code") or "bad reply")
              rows = sorted(data, key=lambda r: int(r[0]))
              now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
              candles, live = [], None
              for r in rows:
                  row = {"t": int(r[0]), "o": float(r[1]), "h": float(r[2]),
                         "l": float(r[3]), "c": float(r[4]), "v": float(r[5])}
                  if int(r[6]) <= now_ms:
                      candles.append(row)
                  else:
                      live = row["c"]
              return candles, live, None
          
          
          def fetch_bybit(url):
              """Bybit v5 kline (linear perp). Returns (candles, live, err)."""
              data = http_get(url)
              if data.get("retCode") != 0:
                  return None, None, "retCode %s" % data.get("retCode")
              rows = sorted(data["result"]["list"], key=lambda r: int(r[0]))
              now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
              candles, live = [], None
              for r in rows:
                  t = int(r[0])
                  row = {"t": t, "o": float(r[1]), "h": float(r[2]),
                         "l": float(r[3]), "c": float(r[4]), "v": float(r[5])}
                  if t + CANDLE_MS <= now_ms:
                      candles.append(row)
                  else:
                      live = row["c"]
              return candles, live, None
          
          
          def _coerce_time(v):
              """TradeLocker time may be epoch seconds/ms or an ISO string."""
              if isinstance(v, (int, float)):
                  if v > 1e12:  # milliseconds
                      v = v / 1000.0
                  return datetime.fromtimestamp(v, tz=timezone.utc).astimezone(ET)
              if isinstance(v, str):
                  return _parse_oanda_time(v).astimezone(ET)
              raise ValueError(f"unrecognised time value: {v!r}")
          
          
          def _pick(row, *names, default=None):
              for n in names:
                  if n in row and row[n] is not None:
                      return row[n]
              return default
          
          
          _TL_API = None
          
          
          def _tl_api():
              """One TradeLocker login per run, shared by the candle and daily fetches
              (before, each fetch logged in again)."""
              global _TL_API
              if _TL_API is None:
                  from tradelocker import TLAPI  # lazy: only needed when this feed is on
                  _TL_API = TLAPI(environment="https://demo.tradelocker.com",
                                  username=TL_EMAIL, password=TL_PASSWORD, server=TL_SERVER)
              return _TL_API
          
          
          def fetch_tradelocker():
              """XAUUSD M15 candles from TradeLocker demo. UNVERIFIED against the live
              API: method names come from the official library's README, but the
              resolution string and returned candle shape are unconfirmed."""
              tl = _tl_api()
              instrument_id = tl.get_instrument_id_from_symbol_name("XAUUSD")
              hist = tl.get_price_history(instrument_id, resolution="15m",
                                          start_timestamp=0, end_timestamp=0,
                                          lookback_period="5D")
              candles = _tl_rows_to_candles(hist)
              live = float(tl.get_latest_asking_price(instrument_id))
              return candles, live, None
          
          
          def _run_fetcher(name, fallback, fn):
              try:
                  candles, live, err = fn()
              except Exception as e:  # noqa: BLE001 - report, don't crash the run
                  candles, live, err = None, None, "%s: %s" % (type(e).__name__, e)
              if err is None and candles is not None and len(candles) < MIN_CANDLES:
                  err = "only %d candles" % len(candles)
                  candles = None
              return {"name": name, "fallback": fallback,
                      "candles": candles, "live": live, "error": err,
                      "fetched_at": datetime.now(ET),
                      "quote": getattr(fn, "quote", None)}
          
          
          def _feed_specs():
              """Ordered (name, fallback, fetch_fn-or-None) for every feed. A None
              fn means the feed is unconfigured (stub result, no HTTP call)."""
              specs = []
              if TL_EMAIL and TL_PASSWORD and TL_SERVER:
                  specs.append(("TradeLocker demo", False, fetch_tradelocker))
              else:
                  specs.append(("TradeLocker demo", False, None))
              if OANDA_API_TOKEN:
                  specs.append(("OANDA XAU/USD", False, fetch_oanda))
              else:
                  specs.append(("OANDA XAU/USD", False, None))
              specs.append(("Binance perp XAUUSDT", True,
                            lambda: fetch_binance(
                                "https://fapi.binance.com/fapi/v1/klines?symbol=XAUUSDT&interval=15m&limit=500")))
              specs.append(("Bybit perp XAUUSDT", True,
                            lambda: fetch_bybit(
                                "https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=15&limit=500")))
              specs.append(("Binance spot PAXGUSDT", True,
                            lambda: fetch_binance(
                                "https://data-api.binance.vision/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=500")))
              return specs
          
          
          def _stub_result(name, fallback, error):
              return {"name": name, "fallback": fallback,
                      "candles": None, "live": None, "error": error}
          
          
          def fetch_all_feeds():
              """Fetch every configured feed. Order is the preference order.
              Used by feedcheck, which compares all feeds."""
              feeds = []
              for name, fallback, fn in _feed_specs():
                  if fn is None:
                      feeds.append(_stub_result(
                          name, fallback,
                          "demo credentials / server not set" if name.startswith("TradeLocker")
                          else "OANDA_API_TOKEN not set"))
                  else:
                      feeds.append(_run_fetcher(name, fallback, fn))
              return feeds
          
          
          def fetch_first_fresh(kind, now_ms):
              """Fetch feeds in preference order, stopping at the first fresh one.
              Used by briefing, which only prices from one feed. TradeLocker and
              OANDA are always fetched first (they feed the gap line); the fallback
              chain stops at the first feed with enough fresh candles. Returns
              (active_or_None, results_so_far)."""
              results = []
              for name, fallback, fn in _feed_specs():
                  if fn is None:
                      results.append(_stub_result(
                          name, fallback,
                          "demo credentials / server not set" if name.startswith("TradeLocker")
                          else "OANDA_API_TOKEN not set"))
                      continue
                  # A fresh primary feed (TradeLocker / OANDA) ends the search: do not
                  # spend a request on a fallback feed that would never be used.
                  if fallback and pick_active(results, kind, now_ms) is not None:
                      break
                  r = _run_fetcher(name, fallback, fn)
                  results.append(r)
                  # Gap feeds (TradeLocker, OANDA) are always collected; the fallback
                  # chain stops at the first usable feed.
                  if not name.startswith(("TradeLocker", "OANDA")):
                      if r["candles"] is not None and not (
                              kind in ("NY", "SWING") and is_stale(r["candles"], now_ms)):
                          break
              return pick_active(results, kind, now_ms), results
          
          
          def price_of(result):
              if result["live"] is not None:
                  return result["live"]
              if result["candles"]:
                  return result["candles"][-1]["c"]
              return None
          
          
          def _offset_for(feed):
              """Chart-minus-feed offset for the feed that prices the card.
              TradeLocker IS the chart, so 0 (leaving PRICE_OFFSET on top of it would
              double-count). OANDA uses PRICE_OFFSET. Fallback feeds use
              PRICE_OFFSET_FALLBACK when it is set, else PRICE_OFFSET (flagged on the
              card, because that number was not calibrated for them)."""
              if feed["name"].startswith("TradeLocker"):
                  return 0.0
              if feed["fallback"] and PRICE_OFFSET_FALLBACK is not None:
                  return PRICE_OFFSET_FALLBACK
              return BASE_OFFSET
          
          
          def is_stale(candles, now_ms):
              last_close_ms = candles[-1]["t"] + CANDLE_MS
              return (now_ms - last_close_ms) > STALE_MINUTES_NY * 60 * 1000
          
          
          def pick_active(results, kind, now_ms):
              """First feed with enough fresh candles. Stale NY feeds are skipped."""
              for r in results:
                  if r["candles"] is None:
                      continue
                  if kind in ("NY", "SWING") and is_stale(r["candles"], now_ms):
                      last = datetime.fromtimestamp(
                          (r["candles"][-1]["t"] + CANDLE_MS) / 1000, tz=timezone.utc)
                      r["error"] = "stale: last candle closed %s UTC" % last.strftime("%H:%M")
                      continue
                  return r
              return None
          
          
          def gap_line(results):
              """TradeLocker vs OANDA difference, when both answered."""
              tl = next((r for r in results if r["name"].startswith("TradeLocker")), None)
              oa = next((r for r in results if r["name"].startswith("OANDA")), None)
              if tl is None or oa is None:
                  return ""
              pt, po = price_of(tl), price_of(oa)
              if pt is None or po is None:
                  return ""
              return "TradeLocker vs OANDA: %+.2f" % (pt - po)
          
          
          # ============================ NEWS ============================
          def parse_news(data):
              """High-impact events for NEWS_COUNTRY from the weekly calendar JSON:
              a sorted list of (datetime ET, title). Bad rows are skipped."""
              out = []
              for e in (data if isinstance(data, list) else []):
                  try:
                      if str(e.get("country", "")).upper() != NEWS_COUNTRY:
                          continue
                      if str(e.get("impact", "")).strip().title() not in NEWS_IMPACTS:
                          continue
                      t = _parse_oanda_time(str(e["date"]))
                      if t.tzinfo is None:
                          t = t.replace(tzinfo=ET)
                      out.append((t.astimezone(ET), str(e.get("title", "news")).strip()[:40]))
                  except Exception:  # noqa: BLE001 - one bad row must not kill the card
                      continue
              out.sort()
              return out
          
          
          def news_events(now):
              """(events, error). At most one fetch per NEWS_CACHE_MIN, cached in the
              state file; a failed fetch reuses the cache when there is one. Never
              raises: an error string is returned and printed on the card."""
              if not NEWS_FILTER:
                  return [], None
              st = _load_state()
              cached = cache_age = None
              try:
                  cached = [(_parse_oanda_time(t).astimezone(ET), n) for t, n in st["news"]]
                  cache_age = now - datetime.fromisoformat(st["news_at"])
              except Exception:  # noqa: BLE001
                  cached = cache_age = None
              if cached is not None and cache_age < timedelta(minutes=NEWS_CACHE_MIN):
                  return cached, None
              # After a failed fetch wait NEWS_RETRY_MIN before trying again: the free
              # calendar rate-limits, and retrying every run keeps it blocked.
              try:
                  recent_fail = (now - datetime.fromisoformat(st["news_fail_at"])
                                 < timedelta(minutes=NEWS_RETRY_MIN))
              except Exception:  # noqa: BLE001
                  recent_fail = False
              if recent_fail:
                  if cached is not None:
                      return cached, None
                  return [], "news calendar unavailable"
              try:
                  data = http_get(NEWS_URL)
                  if not isinstance(data, list) or not data:
                      raise ValueError("unexpected calendar shape")
                  ev = parse_news(data)
                  _save_state(news=[[t.isoformat(), n] for t, n in ev],
                              news_at=now.isoformat(), news_fail_at=None)
                  return ev, None
              except Exception as e:  # noqa: BLE001
                  print("News fetch failed:", type(e).__name__, e)
                  _save_state(news_fail_at=now.isoformat())
                  if cached is not None:
                      return cached, None
                  return [], "news calendar unavailable"
          
          
          def news_window(events, now):
              """(card line, signature key) while an event is from NEWS_BEFORE_MIN ahead
              to NEWS_AFTER_MIN past, else None."""
              for t, title in events:
                  end = t + timedelta(minutes=NEWS_AFTER_MIN)
                  if t - timedelta(minutes=NEWS_BEFORE_MIN) <= now <= end:
                      return ("⚠ NEWS: USD %s %s ET — no entries until %s" % (
                          title, t.strftime("%H:%M"), end.strftime("%H:%M")),
                          "%s|%s" % (t.strftime("%m%d%H%M"), title))
              return None
          
          
          def news_for_card(now):
              """(line, key) for the card, or None. Never raises."""
              try:
                  events, err = news_events(now)
                  if err:
                      return ("⚠ NEWS: %s — check the red-folder calendar yourself" % err, "ERR")
                  return news_window(events, now)
              except Exception as e:  # noqa: BLE001
                  print("News check failed:", type(e).__name__, e)
                  return None
          
          
          # ============================ LEVELS ============================
          def to_ms(dt):
              return int(dt.astimezone(timezone.utc).timestamp() * 1000)
          
          
          def hi_lo(candles, start, end):
              s, e = to_ms(start), to_ms(end)
              sel = [c for c in candles if s <= c["t"] < e]
              if not sel:
                  return None
              return max(c["h"] for c in sel), min(c["l"] for c in sel)
          
          
          def prior_day_window(now):
              """Previous full trading day, skipping blocks when spot gold is closed.
          
              A block starts at 18:00 ET. Blocks that start on Friday or Saturday are
              closed, so they are skipped (Monday morning shows the Friday session).
              """
              end = now.replace(hour=DAY_START_HOUR_ET, minute=0, second=0, microsecond=0)
              if now < end:
                  end -= timedelta(days=1)
              begin = end - timedelta(days=1)
              for _ in range(7):
                  if begin.weekday() not in (4, 5):
                      return begin, end
                  end = begin
                  begin = begin - timedelta(days=1)
              return begin, end
          
          
          def vwap_anchor(now):
              """Start of the current session VWAP: the most recent 18:00 ET (gold
              reopen). His TradingView Session VWAP restarts at 18:05 ET; on 15m bars
              the 18:00 bar is the one that holds 18:05, so it is the anchor."""
              a = now.replace(hour=DAY_START_HOUR_ET, minute=0, second=0, microsecond=0)
              if now < a:
                  a -= timedelta(days=1)
              return a
          
          
          def session_vwap(candles, start):
              s = to_ms(start)
              num = den = 0.0
              for c in candles:
                  if c["t"] >= s:
                      tp = (c["h"] + c["l"] + c["c"]) / 3.0
                      num += tp * c.get("v", 0)
                      den += c.get("v", 0)
              return num / den if den > 0 else None
          
          
          def build_levels(candles, now, kind):
              """Return (items, orb, partial_london). items are (price, label) before offset."""
              items = []
              orb = None
              partial = False
          
              pd_begin, pd_end = prior_day_window(now)
              r = hi_lo(candles, pd_begin, pd_end)
              if r:
                  items += [(r[0], "PDH"), (r[1], "PDL")]
          
              if kind in ("NY", "SWING"):
                  d03 = now.replace(hour=3, minute=0, second=0, microsecond=0)
                  if now < d03:
                      d03 -= timedelta(days=1)
                  asia_start = (d03 - timedelta(days=1)).replace(hour=19)
                  r = hi_lo(candles, asia_start, d03)
                  if r:
                      items += [(r[0], "ASIA H"), (r[1], "ASIA L")]
          
                  d08 = d03.replace(hour=8)
                  london_end = min(now, d08)
                  partial = now < d08
                  r = hi_lo(candles, d03, london_end)
                  if r:
                      items += [(r[0], "LON H"), (r[1], "LON L")]
          
                  orb_end = d08 + timedelta(minutes=15)
                  if now >= orb_end:
                      orb = hi_lo(candles, d08, orb_end)
                      if orb:
                          items += [(orb[0], "ORB H"), (orb[1], "ORB L")]
                          # Past ORB_LAST_HOUR_ET the levels stay (TP candidates) but
                          # no ORB setup is built from them.
                          if now >= d08.replace(hour=ORB_LAST_HOUR_ET):
                              orb = None
              return items, orb, partial
          
          
          def _formed_times(now):
              """When each session level was complete (ms), for the same session
              build_levels uses: after midnight ET the ASIA / LON levels are still
              yesterday's, and PDH / PDL are complete when the prior-day window ends.
              (Before, today's date was used, so between 00:00 and 03:00 ET the levels
              looked like they formed in the future and no retest or sweep could fire.)"""
              d03 = now.replace(hour=3, minute=0, second=0, microsecond=0)
              if now < d03:
                  d03 -= timedelta(days=1)
              pd_end = to_ms(prior_day_window(now)[1])
              asia, lon = to_ms(d03), to_ms(d03.replace(hour=8))
              return {"PDH": pd_end, "PDL": pd_end, "ASIA H": asia, "ASIA L": asia,
                      "LON H": lon, "LON L": lon}
          
          
          def _atr_latest(candles, n=14):
              """Wilder ATR(n) on 15m candles; latest value or None."""
              if len(candles) < n + 1:
                  return None
              trs = []
              for i in range(1, len(candles)):
                  pc = candles[i - 1]["c"]
                  trs.append(max(candles[i]["h"] - candles[i]["l"],
                                 abs(candles[i]["h"] - pc),
                                 abs(candles[i]["l"] - pc)))
              a = sum(trs[:n]) / n
              for tr in trs[n:]:
                  a = (a * (n - 1) + tr) / n
              return a
          
          
          VOL_SQUEEZE = 0.7     # recent range / ATR below this = contraction
          VOL_EXPAND = 1.5      # above this = expansion
          VOL_SPIKE_X = 2.0     # one candle this many ATRs wide = spike
          
          
          def vol_state(candles, n=14, recent=4):
              """Volatility read on 15m candles: (state, ratio, spike).
              ratio = average true range of the last `recent` candles / ATR(n).
              state: SQUEEZE (<0.7), NORMAL, EXPANDING (>1.5); None if too little data.
              spike is True when any of the last 3 candles is >= 2x ATR wide."""
              atr = _atr_latest(candles, n)
              if atr is None or atr <= 0 or len(candles) < recent + 1:
                  return None, None, False
              trs = []
              for i in range(len(candles) - recent, len(candles)):
                  pc = candles[i - 1]["c"]
                  trs.append(max(candles[i]["h"] - candles[i]["l"],
                                 abs(candles[i]["h"] - pc),
                                 abs(candles[i]["l"] - pc)))
              ratio = (sum(trs) / len(trs)) / atr
              spike = any((c["h"] - c["l"]) >= VOL_SPIKE_X * atr for c in candles[-3:])
              if ratio < VOL_SQUEEZE:
                  state = "SQUEEZE"
              elif ratio > VOL_EXPAND or spike:
                  state = "EXPANDING"
              else:
                  state = "NORMAL"
              return state, ratio, spike
          
          
          def vol_line(state, ratio):
              if state is None:
                  return None
              if state == "SQUEEZE":
                  return "Range: SQUEEZE x%.1f - weak edge, smaller size or skip" % ratio
              if state == "EXPANDING":
                  return "Range: expanding x%.1f" % ratio
              return "Range: normal x%.1f" % ratio
          
          
          def counter_trend(direction, w_macd, d_macd, bias_1h):
              """True when the weekly MACD, daily MACD and the 1H bias that exist
              (at least two) all point against the trade."""
              def sgn(v):
                  if v is None or v == 0:
                      return None
                  return 1 if v > 0 else -1
              votes = [v for v in (sgn(w_macd), sgn(d_macd), bias_1h) if v is not None]
              want = 1 if direction == "long" else -1
              return len(votes) >= 2 and all(v == -want for v in votes)
          
          
          def near_swing(swings, kind, raw_price, above, span=ZONE_LEVEL_SPAN, slack=5.0):
              """Nearest swing level (broken or not) above / below price within span
              points. A level price has just passed by up to `slack` pts still counts,
              so a zone price is inside keeps its edge. Returns the raw price or None.
              Broken levels count on purpose: a broken 4H/daily high keeps acting as
              resistance, which is how he marks it."""
              ps = []
              for s in swings:
                  if s["kind"] != kind:
                      continue
                  p = s["price"]
                  if above and raw_price - slack < p <= raw_price + span:
                      ps.append(p)
                  elif not above and raw_price - span <= p < raw_price + slack:
                      ps.append(p)
              if not ps:
                  return None
              return min(ps) if above else max(ps)
          
          
          def select_alerts(price, cands):
              """Pick the TradingView alerts from (trigger price, label, setup) in
              priority order: skip a trigger price is already at (<= AT_ENTRY_PTS) or
              farther than ALERT_MAX_DIST, merge triggers within 3 pts, then add the
              invalidation alert (NO SHORTS / NO LONGS) of the first zone alert,
              replacing the lowest-priority other alert if all 3 slots are used. The
              invalidation alert is exempt from ALERT_MAX_DIST (it is tied to the
              stop, which sits past the zone) but must be INVAL_MIN_GAP from its
              entry alert."""
              out = []
              for p, lab, s in cands:
                  d = abs(p - price)
                  if d <= AT_ENTRY_PTS or d > ALERT_MAX_DIST:
                      continue
                  if all(abs(p - q) >= 3.0 for q, _, _x in out):
                      out.append((p, lab, s))
              owner = next((x for x in out if x[2].get("inval")), None)
              if owner is not None:
                  ip, il = owner[2]["inval"]
                  if (abs(ip - owner[0]) >= INVAL_MIN_GAP
                          and all(abs(ip - q) >= 3.0 for q, _, _x in out)):
                      if len(out) < 3:
                          out.append((ip, il, {}))
                      else:
                          for k in range(len(out) - 1, -1, -1):
                              if out[k] is not owner:
                                  out[k] = (ip, il, {})
                                  break
              return out
          
          
          def plan_geometry(price, atr, vwap, h4_h, h4_l, d_h, d_l):
              """His way of choosing entries, as pure geometry (all prices already
              offset). Returns a list of plan dicts, each with label, direction,
              entry, risk (None = default max(ATR, 10)), cond, invalid, inval_alert.
          
              SELL ZONE: fade the band between the nearest unbroken 4H high and the
                nearest unbroken daily high above price. Stop = just above the zone
                top (+3), entry = zone bottom, but never more than 15 pts from the
                stop (his max stop), minimum risk 10. The alert "NO SHORTS" sits at
                the stop level: price trading there means the high is taken.
              BUY ZONE: mirror at the 4H low / daily low below price.
              VWAP BREAK: price on one side of VWAP within 3 ATR: entry at VWAP, a
                15m close through it triggers (short if price is above, long if below).
              Only built when price is within 3 ATR of the zone / VWAP."""
              out = []
              if atr is None or atr <= 0:
                  return out
              reach = 3.0 * atr
              hs = sorted(p for p in (h4_h, d_h) if p is not None)
              if hs:
                  lo = hs[0]
                  hi = hs[-1] if hs[-1] - lo <= ZONE_PAIR_MAX else lo
                  if hi > price and (lo - price) <= reach:
                      stop0 = hi + 3.0
                      entry = max(lo, stop0 - 15.0)
                      stop = max(stop0, entry + 10.0)
                      out.append({
                          "label": "SELL ZONE", "direction": "short", "entry": entry,
                          "risk": stop - entry,
                          "cond": ("15m rejection in %s-%s" % (format(lo, ",.1f"), format(hi, ",.1f"))
                                   if hi - lo >= 1.0 else
                                   "15m rejection at %s" % format(hi, ",.1f")),
                          "invalid": (hi, "above"), "zone": (lo, hi),
                          "inval_alert": (stop0, "NO SHORTS")})
              ls = sorted((p for p in (h4_l, d_l) if p is not None), reverse=True)
              if ls:
                  hi = ls[0]
                  lo = ls[-1] if hi - ls[-1] <= ZONE_PAIR_MAX else hi
                  if lo < price and (price - hi) <= reach:
                      stop0 = lo - 3.0
                      entry = min(hi, stop0 + 15.0)
                      stop = min(stop0, entry - 10.0)
                      out.append({
                          "label": "BUY ZONE", "direction": "long", "entry": entry,
                          "risk": entry - stop,
                          "cond": ("15m rejection in %s-%s" % (format(lo, ",.1f"), format(hi, ",.1f"))
                                   if hi - lo >= 1.0 else
                                   "15m rejection at %s" % format(lo, ",.1f")),
                          "invalid": (lo, "below"), "zone": (lo, hi),
                          "inval_alert": (stop0, "NO LONGS")})
              if vwap is not None:
                  if price > vwap and (price - vwap) <= reach:
                      out.append({
                          "label": "VWAP BREAK SHORT", "direction": "short",
                          "entry": vwap, "risk": None,
                          "cond": "15m close below VWAP %s" % format(vwap, ",.1f"),
                          "invalid": (vwap + 0.25 * atr, "above"),
                          "inval_alert": None})
                  elif price < vwap and (vwap - price) <= reach:
                      out.append({
                          "label": "VWAP BREAK LONG", "direction": "long",
                          "entry": vwap, "risk": None,
                          "cond": "15m close above VWAP %s" % format(vwap, ",.1f"),
                          "invalid": (vwap - 0.25 * atr, "below"),
                          "inval_alert": None})
              return out
          
          
          def _room_of(tps):
              """Room in R for the score and the 1R gate, per ROOM_BASIS (see above).
              tps is the ladder [(price, R), ...] nearest first; [] -> 0.0."""
              if not tps:
                  return 0.0
              if ROOM_BASIS == "tp1" or len(tps) == 1:
                  return tps[0][1]
              if ROOM_BASIS == "tp2":
                  return tps[1][1]
              return tps[-1][1]
          
          
          def _clamp_stop_dist(dist, floor, cap):
              """Clamp a stop distance to [floor, cap]. Returns None to skip the
              trade when the distance is over the cap (too wild, do not squeeze)."""
              if dist is None or dist <= 0:
                  return None
              if dist > cap:
                  return None
              return max(dist, floor)
          
          
          def _setup_block(s, header):
              """One setup as a compact block: header, entry/SL, TPs+invalid, why.
              TPs are slash-separated in order (TP1 first), so the TP1/TP2 labels
              are implicit in the order. The per-setup invalidation stays on the
              TP line; its timeframe comes from s['invalid_tf'] ('15m' for scalps,
              '4H' for swings)."""
              out = [header]
              entry_line = "Entry %s · SL %s · Risk %.1f" % (
                  format(s["entry"], ",.1f"), format(s["stop"], ",.1f"), s["risk"])
              if s.get("pending"):
                  # The fill comes after the 15m close, past the level: stop the chase
                  # before the real risk passes the 15-pt cap.
                  slack = min(MAX_CHASE_PTS, max(0.0, MAX_STOP_PTS - s["risk"]))
                  if slack >= 0.5:
                      lim = s["entry"] - slack if s["direction"] == "short" else s["entry"] + slack
                      entry_line += " · Max chase %s" % format(lim, ",.1f")
                  else:
                      entry_line += " · No chase"
              out.append(entry_line)
              if s["tps"]:
                  tp_line = "TPs " + "/".join(format(p, ",.1f") for p, r in s["tps"])
                  tp_line += " (%s)" % "/".join("%.1fR" % r for p, r in s["tps"])
              else:
                  tp_line = "No TPs: no levels ahead"
              if s.get("invalid"):
                  ip, side = s["invalid"]
                  tf = s.get("invalid_tf", "15m")
                  tp_line += " · Invalid %s close %s %s" % (tf, side, format(ip, ",.1f"))
              out.append(tp_line)
              out.append("Why: %s" % s["why"])
              return out
          
          
          def _swing_lines(candles, now, price, kind):
              """The swing section lines (📅 header + ranked swing setup block),
              or [] when alerts are off or no 4H level is being retested. Shared
              by the Sunday week-open card and the Wednesday midday swing card."""
              swing = get_swing_setups(candles, now, price - PRICE_OFFSET, kind)
              if not swing:
                  return []
              out = ["", "📅 SWING (4H, held days/weeks)"]
              for i, s in enumerate(swing, 1):
                  verdict = ("🟢 TRADE" if s["trade"]
                             else "⛔ NO TRADE: " + "; ".join(s["reasons"]))
                  out.extend(_setup_block(
                      s, "%d. %s %s · %d/5" % (i, s["label"], verdict, s["score"])))
              return out
          
          
          def get_swing_setups(candles, now, raw_price, kind):
              """4H swing retest setups — live version of the validated backtest
              scan_swing (breakout + retest on 4H, stop = max(4H ATR, 30) capped
              at 60, same gate as the scalp card: room >= 1R and score >= 3 — no
              2:1 minimum, per the standing agreement). Returns at most 1 setup
              dict (the best by room), same shape as build_setup, so setup_block
              can render it. Empty list when swing alerts are off, the 4H ATR is
              over 60, or no broken 4H level is being retested near price. Prices
              in the returned dict are offset (what the card shows)."""
              if not SWING_ALERTS:
                  return []
              if len(candles) < 16:
                  return []
              h4 = _resample(candles, 240)
              if len(h4) < 16:
                  return []
              atr4 = _atr_latest(h4)
              if atr4 is None:
                  return []
              risk = _clamp_stop_dist(atr4, SWING_STOP_FLOOR, SWING_STOP_CAP)
              if risk is None:
                  return []
              # Levels ahead (TPs): session levels + 4H swings + 15m swings.
              items, _orb, _partial = build_levels(candles, now, kind)
              levels = {label: p + PRICE_OFFSET for (p, label) in items}
              h4_sw = _swing_points(h4, bar_ms=4 * 3600 * 1000)
              for s in h4_sw:
                  tag = "4H H" if s["kind"] == "H" else "4H L"
                  if tag not in levels:
                      levels[tag] = s["price"] + PRICE_OFFSET
              # Scoring factors (same as the scalp card, from 15m candles).
              vols = [c.get("v", 0) for c in candles]
              vol_ok = (len(vols) >= 21 and sum(vols[-21:-1]) > 0
                        and vols[-1] > 1.5 * (sum(vols[-21:-1]) / 20.0))
              macd_hist = _macd_hist_latest(candles)
              # 1H bias (MACD line + structure agree), same as the scalp card.
              h1 = _resample(candles, 60)
              h1_line = _macd_line_series(h1)
              h1_macd = h1_line[-1] if h1_line else None
              h1_h, h1_l = _last_swings(h1, bar_ms=3600 * 1000)
              h1_struct = _structure(h1, bar_ms=3600 * 1000, swings=(h1_h, h1_l))
              bias_1h = None
              if h1_macd is not None and h1_struct is not None:
                  if h1_macd > 0 and h1_struct == 1:
                      bias_1h = 1
                  elif h1_macd < 0 and h1_struct == -1:
                      bias_1h = -1
              # Session VWAP from the most recent 18:00 ET (None when no candles
              # since then, e.g. Sunday before the open).
              vwap = session_vwap(candles, vwap_anchor(now))
              if vwap is not None:
                  vwap += PRICE_OFFSET
              # Retest candidates: a confirmed 4H swing level that broke (a 4H close
              # beyond it after confirmation), with price near it now and not
              # invalidated (closed through by >0.25x 4H ATR). Long = breakout above
              # a swing high, short = breakout below a swing low.
              cands = []
              for s in h4_sw:
                  lv = s["price"]
                  is_high = s["kind"] == "H"
                  direction = "long" if is_high else "short"
                  broke = any((c["c"] > lv if is_high else c["c"] < lv)
                              for c in h4 if c["t"] >= s["conf_ms"])
                  if not broke:
                      continue
                  if abs(raw_price - lv) > 1.5 * atr4:
                      continue
                  last_c = candles[-1]["c"]
                  if is_high and last_c < lv - 0.25 * atr4:
                      continue
                  if not is_high and last_c > lv + 0.25 * atr4:
                      continue
                  cands.append((abs(raw_price - lv), lv, direction,
                                "4H H" if is_high else "4H L"))
              cands.sort()
              best = None
              for _d, lv, direction, tag in cands:
                  entry = lv + PRICE_OFFSET
                  stop = entry - risk if direction == "long" else entry + risk
                  # Swing TPs are the major levels ahead only (PDH/PDL, 4H swings,
                  # daily/weekly) — intraday ASIA/LON/ORB/15m levels are too close
                  # for a trade held days, and would shrink the room to nothing.
                  tp_levels = {lab: p for lab, p in levels.items()
                               if not lab.startswith(("ASIA", "LON", "ORB", "15m"))}
                  ahead = sorted([p for p in tp_levels.values()
                                  if (p > entry if direction == "long" else p < entry)],
                                 reverse=(direction == "short"))
                  # Targets are zones, not lines: drop levels inside the entry zone
                  # (within 3 pts of entry — TP1 at 0.0R is not a target) and merge
                  # levels within 3 pts of each other, so TP1 is the first
                  # meaningful level. The furthest level (room) is unchanged unless
                  # every level ahead was in the zone.
                  _ahead = []
                  for p in ahead:
                      if abs(p - entry) < 3.0:
                          continue
                      if _ahead and abs(p - _ahead[-1]) < 3.0:
                          continue
                      _ahead.append(p)
                  ahead = _ahead
                  tps = []
                  for p in ahead[:4]:
                      r = ((p - entry) / risk if direction == "long"
                           else (entry - p) / risk)
                      tps.append((p, r))
                  if not tps:
                      continue
                  room = tps[-1][1]
                  score = 0
                  if room >= 2.0:
                      score += 2
                  elif room >= 1.0:
                      score += 1
                  if vol_ok:
                      score += 1
                  vwap_with = (vwap is not None and
                               ((direction == "long" and entry > vwap) or
                                (direction == "short" and entry < vwap)))
                  if vwap_with:
                      score += 1
                  macd_ok = (macd_hist is not None and
                             ((direction == "long" and macd_hist > 0) or
                              (direction == "short" and macd_hist < 0)))
                  if macd_ok:
                      score += 1
                  reasons = []
                  if room < 1.0:
                      reasons.append("room %.1fR < 1R" % room)
                  if score < 3:
                      reasons.append("score %d < 3" % score)
                  ran = ((raw_price + PRICE_OFFSET - entry) / risk
                         if direction == "long"
                         else (entry - (raw_price + PRICE_OFFSET)) / risk)
                  if ran > 0.5:
                      reasons.append("already ran %.1fR past entry" % ran)
                  why = ["room %.1fR%s" % (room, " 🤑" if room >= 5.0 else ""),
                         "vol ✓" if vol_ok else "vol ✗",
                         "VWAP ✓" if vwap_with else "VWAP ✗",
                         "MACD ✓" if macd_ok else "MACD ✗"]
                  if bias_1h is None:
                      why.append("1H bias ~")
                  elif ((direction == "long" and bias_1h == 1)
                        or (direction == "short" and bias_1h == -1)):
                      why.append("1H bias ✓")
                  else:
                      why.append("1H bias ✗")
                  # (Nov 8 fix: this used is_high left over from the first loop, so the
                  # invalidation side could be wrong. The direction decides it.)
                  inv = (lv - 0.25 * atr4 + PRICE_OFFSET, "below") if direction == "long" else \
                        (lv + 0.25 * atr4 + PRICE_OFFSET, "above")
                  s = {"label": "SWING " + ("LONG" if direction == "long" else "SHORT"),
                       "direction": direction, "entry": entry, "stop": stop,
                       "risk": risk, "tps": tps, "room": room, "score": score,
                       "trade": not reasons, "reasons": reasons,
                       "why": " · ".join(why),
                       "cond": "retest of %s" % tag, "invalid": inv,
                       "invalid_tf": "4H"}
                  if best is None or (room, score) > (best["room"], best["score"]):
                      best = s
              return [best] if best is not None else []
          
          
          def _macd_hist_latest(candles):
              """MACD(12,26,9) histogram on closes; latest value or None.
              Reuses _macd_line_series for the MACD line instead of recomputing
              the two EMAs here."""
              if len(candles) < 35:
                  return None
              macd = _macd_line_series(candles)
              first = next(i for i, m in enumerate(macd) if m is not None)
              mvals = macd[first:]
              if len(mvals) < 9:
                  return None
              sig = _ema_series(mvals, 9)
              return mvals[-1] - sig[-1] if sig[-1] is not None else None
          
          
          def _pct_move(candles, bars_back):
              if len(candles) <= bars_back:
                  return None
              old = candles[-1 - bars_back]["c"]
              return 100.0 * (candles[-1]["c"] - old) / old
          
          
          # ============================ HIGHER TIMEFRAMES (checklist) ============================
          def _ema_series(vals, n):
              """EMA aligned to vals (None until the first n values seed it)."""
              k = 2.0 / (n + 1)
              out = [None] * len(vals)
              if len(vals) >= n:
                  out[n - 1] = sum(vals[:n]) / n
                  for i in range(n, len(vals)):
                      out[i] = vals[i] * k + out[i - 1] * (1 - k)
              return out
          
          
          def _macd_line_series(candles, fast=12, slow=26):
              """MACD line (fast EMA minus slow EMA) aligned to candles. This is the
              'MACD above or below zero' read the checklist uses for trend and bias."""
              closes = [c["c"] for c in candles]
              ef = _ema_series(closes, fast)
              es = _ema_series(closes, slow)
              return [(a - b if a is not None and b is not None else None)
                      for a, b in zip(ef, es)]
          
          
          def _resample(candles, minutes):
              """Group bars into N-minute bars. 4H bars are aligned to the 17:00 ET
              forex day (01/05/09/13/17/21 ET) so swings match a TradingView OANDA
              chart; everything else is aligned to the UTC clock."""
              span = minutes * 60 * 1000
              hour = 3600 * 1000
              et_aligned = minutes == 240  # forex 4H bars open 01/05/09/13/17/21 ET
              out = []
              cur = None
              for c in candles:
                  if et_aligned:
                      off = int(datetime.fromtimestamp(c["t"] / 1000, tz=ET)
                                .utcoffset().total_seconds() * 1000)
                      key = ((c["t"] + off - hour) // span) * span + hour - off
                  else:
                      key = (c["t"] // span) * span
                  if cur is None or cur["t"] != key:
                      cur = {"t": key, "o": c["o"], "h": c["h"], "l": c["l"],
                             "c": c["c"], "v": c.get("v", 0)}
                      out.append(cur)
                  else:
                      cur["h"] = max(cur["h"], c["h"])
                      cur["l"] = min(cur["l"], c["l"])
                      cur["c"] = c["c"]
                      cur["v"] += c.get("v", 0)
              return out
          
          
          def _weekly_bars(daily):
              """Group daily bars into ISO calendar weeks (Mon-Sun)."""
              out = []
              cur = None
              for c in daily:
                  # +3h: OANDA daily bars are stamped 17:00 ET the evening BEFORE (Sunday
                  # 22:00 UTC for Monday's session), which ISO-week grouping would drop
                  # into the previous week.
                  dt = (datetime.fromtimestamp(c["t"] / 1000, tz=timezone.utc)
                        + timedelta(hours=3))
                  key = dt.isocalendar()[:2]
                  if cur is None or cur["key"] != key:
                      cur = {"key": key, "t": c["t"], "o": c["o"], "h": c["h"],
                             "l": c["l"], "c": c["c"], "v": c.get("v", 0)}
                      out.append(cur)
                  else:
                      cur["h"] = max(cur["h"], c["h"])
                      cur["l"] = min(cur["l"], c["l"])
                      cur["c"] = c["c"]
                      cur["v"] += c.get("v", 0)
              return out
          
          
          def _swing_points(candles, k=2, bar_ms=15 * 60 * 1000):
              """Swing highs/lows: bar j is a swing high if its high is the max of
              highs[j-k..j+k] and strictly above both neighbours (same for lows).
              Each swing carries its confirmation time in ms - only knowable once
              that bar closes, so nothing here peeks ahead."""
              out = []
              n = len(candles)
              for j in range(k, n - k):
                  hj = candles[j]["h"]
                  lj = candles[j]["l"]
                  if (hj > candles[j - 1]["h"] and hj > candles[j + 1]["h"]
                          and hj == max(c["h"] for c in candles[j - k:j + k + 1])):
                      out.append({"t": candles[j]["t"], "conf_ms": candles[j + k]["t"] + bar_ms,
                                  "price": hj, "kind": "H"})
                  if (lj < candles[j - 1]["l"] and lj < candles[j + 1]["l"]
                          and lj == min(c["l"] for c in candles[j - k:j + k + 1])):
                      out.append({"t": candles[j]["t"], "conf_ms": candles[j + k]["t"] + bar_ms,
                                  "price": lj, "kind": "L"})
              return out
          
          
          def _last_swings(candles, k=2, bar_ms=15 * 60 * 1000, as_of_ms=None):
              """The last two confirmed swing highs and lows (prices, newest first).
              as_of_ms limits to swings confirmed at or before that time."""
              sw = _swing_points(candles, k=k, bar_ms=bar_ms)
              if as_of_ms is not None:
                  sw = [s for s in sw if s["conf_ms"] <= as_of_ms]
              highs = [s["price"] for s in sw if s["kind"] == "H"][-2:]
              lows = [s["price"] for s in sw if s["kind"] == "L"][-2:]
              return highs[::-1], lows[::-1]
          
          
          def _structure(candles, k=2, bar_ms=15 * 60 * 1000, as_of_ms=None, swings=None):
              """Structure from the last two confirmed swing highs/lows: +1 for
              HH/HL (bullish), -1 for LH/LL (bearish), None when mixed or unknown.
              Pass precomputed swings (from _last_swings) to avoid recomputing them."""
              if swings is None:
                  swings = _last_swings(candles, k=k, bar_ms=bar_ms, as_of_ms=as_of_ms)
              highs, lows = swings
              if len(highs) < 2 or len(lows) < 2:
                  return None
              if highs[0] > highs[1] and lows[0] > lows[1]:
                  return 1
              if highs[0] < highs[1] and lows[0] < lows[1]:
                  return -1
              return None
          
          
          def _unbroken(candles, swings):
              """The swings price has never closed beyond since they formed: a swing
              high is broken by a later close above it, a swing low by a later close
              below it. Returns (unbroken highs, unbroken lows) as swing dicts, in
              time order. The checklist deletes broken lines; these are the live ones."""
              out_h, out_l = [], []
              for s in swings:
                  broken = False
                  for c in candles:
                      if c["t"] <= s["t"]:
                          continue
                      if s["kind"] == "H" and c["c"] > s["price"]:
                          broken = True
                          break
                      if s["kind"] == "L" and c["c"] < s["price"]:
                          broken = True
                          break
                  if not broken:
                      (out_h if s["kind"] == "H" else out_l).append(s)
              return out_h, out_l
          
          
          def _sane_daily(candles):
              """Drop daily bars with impossible wicks (bad prints). A real gold
              day never has a high 3% above both its open and close, or a low 3%
              below both. PAXG's feed carries such prints, and they poison the
              weekly/daily swing levels."""
              out = []
              for c in candles:
                  hi = max(c["o"], c["c"])
                  lo = min(c["o"], c["c"])
                  if c["h"] > 1.03 * hi or c["l"] < 0.97 * lo:
                      continue
                  out.append(c)
              return out or None
          
          
          def fetch_daily_for(name):
              """Daily bars for the active feed (context: weekly/daily trend). Best
              effort: returns a list of daily bars or None. TradeLocker daily is
              untested, like the rest of that feed."""
              try:
                  if name.startswith("OANDA"):
                      url = (f"{OANDA_HOST}/v3/instruments/XAU_USD/candles"
                             "?granularity=D&count=300&price=M")
                      req = urllib.request.Request(url, headers={
                          "Authorization": f"Bearer {OANDA_API_TOKEN}",
                          "Accept": "application/json",
                      })
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = json.load(resp)
                      out = []
                      for c in data.get("candles", []):
                          if not c.get("complete"):
                              continue
                          mid = c.get("mid", {})
                          out.append({
                              "t": int(_parse_oanda_time(c["time"]).timestamp() * 1000),
                              "o": float(mid["o"]), "h": float(mid["h"]),
                              "l": float(mid["l"]), "c": float(mid["c"]),
                              "v": float(c.get("volume", 0)),
                          })
                      return out or None
                  if name.startswith("Binance perp"):
                      candles, _, _ = fetch_binance(
                          "https://fapi.binance.com/fapi/v1/klines?symbol=XAUUSDT&interval=1d&limit=300")
                      return candles
                  if name.startswith("Bybit"):
                      candles, _, _ = fetch_bybit(
                          "https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=D&limit=300")
                      return candles
                  if name.startswith("Binance spot"):
                      candles, _, _ = fetch_binance(
                          "https://data-api.binance.vision/api/v3/klines?symbol=PAXGUSDT&interval=1d&limit=300")
                      return candles
                  if name.startswith("TradeLocker"):
                      tl = _tl_api()
                      instrument_id = tl.get_instrument_id_from_symbol_name("XAUUSD")
                      hist = tl.get_price_history(instrument_id, resolution="1d",
                                                  start_timestamp=0, end_timestamp=0,
                                                  lookback_period="300D")
                      return _tl_rows_to_candles(hist)
              except Exception:
                  return None
              return None
          
          
          def _tl_rows_to_candles(hist):
              """TradeLocker price-history rows (any shape the library returns) into
              our candle dicts, sorted by time."""
              if hasattr(hist, "to_dict"):  # pandas DataFrame
                  rows = hist.to_dict("records")
              elif isinstance(hist, dict) and "candles" in hist:
                  rows = hist["candles"]
              elif isinstance(hist, list):
                  rows = hist
              else:
                  raise RuntimeError(
                      f"TradeLocker price history came back in an unexpected shape "
                      f"({type(hist).__name__}); check the run log.")
              candles = []
              for row in rows:
                  t = _coerce_time(_pick(row, "time", "timestamp", "date"))
                  candles.append({
                      "t": int(t.astimezone(timezone.utc).timestamp() * 1000),
                      "o": float(_pick(row, "open", "o")),
                      "h": float(_pick(row, "high", "h")),
                      "l": float(_pick(row, "low", "l")),
                      "c": float(_pick(row, "close", "c")),
                      "v": float(_pick(row, "volume", "tick_volume", default=0)),
                  })
              candles.sort(key=lambda c: c["t"])
              return candles
          
          
          def offset_note(now):
              """A card warning when the offset in use was last checked too long ago.
              Empty when no offset is added (TradeLocker feed) or no date is set."""
              if not OFFSET_DATE or PRICE_OFFSET == 0:
                  return ""
              try:
                  d = datetime.fromisoformat(OFFSET_DATE).date()
              except ValueError:
                  return "\n⚠ PRICE_OFFSET_DATE must read YYYY-MM-DD"
              age = (now.date() - d).days
              if age > OFFSET_MAX_AGE_DAYS:
                  return "\n⚠ offset last checked %d days ago - rerun feedcheck" % age
              return ""
          
          
          def _feed_line(feed_name, fallback_note, priced_at, raw_price):
              """The card's last lines: which feed, WHEN it was sampled, the raw feed
              price and the offset added to it. With the sample time on the card, a
              comparison with the TradeLocker chart is like for like; without it a
              15-minute-old price looks like an offset error."""
              out = "feed: %s%s" % (feed_name, fallback_note)
              if priced_at is not None:
                  out += "\npriced %s ET · raw %s · offset %+.2f" % (
                      priced_at.astimezone(ET).strftime("%H:%M:%S"),
                      format(raw_price, ",.2f"), PRICE_OFFSET)
                  out += offset_note(priced_at.astimezone(ET))
              return out
          
          
          def make_card(candles, live, now, kind, feed_name, fallback_note, gap, daily=None,
                        priced_at=None, news=None, decisions=None):
              last_close = candles[-1]["c"]
              price = (live if live is not None else last_close) + PRICE_OFFSET
              items, orb, partial = build_levels(candles, now, kind)
              rows = [(p + PRICE_OFFSET, label) for (p, label) in items]
              vwap = None
              if kind == "NY":
                  vwap = session_vwap(candles, vwap_anchor(now))
                  if vwap is not None:
                      vwap += PRICE_OFFSET
                      rows.append((vwap, "VWAP"))
              rows.append((price, "NOW"))
              rows.sort(key=lambda x: -x[0])
              _sun_rows = list(rows)
              if kind == "SUNDAY":
                  # Sunday scalps use Friday's session levels (ASIA/LON from the
                  # weekend PAXG range). The Sunday ORB is thin-market noise, so
                  # its levels are dropped: no ORB setups (orb is already None
                  # for SUNDAY) and no ORB retests. VWAP stays None (it anchored
                  # 5 minutes ago): no VWAP BREAK setups, no VWAP score point.
                  items = [x for x in build_levels(candles, now, "NY")[0]
                           if x[1] not in ("ORB H", "ORB L")]
          
              # SUNDAY runs the NY scalp flow below (EXECUTE / PREPARE / WATCH +
              # alerts). The week-open levels stay on top and the swing section
              # is appended before the feed line; see the end of the NY flow.
          
              if kind == "SWING":
                  # Midweek swing check: 4H setups only (held days/weeks). Same
                  # layout as the scalp setups, with the swing stop (30-60 pts)
                  # and the 5-minute news rule for trades held over news.
                  tf = [("24h", _pct_move(candles, 96)), ("4H", _pct_move(candles, 16)),
                        ("1H", _pct_move(candles, 4)), ("15m", _pct_move(candles, 1))]
                  tf_line = " | ".join("%s %s" % (n, ("%+.1f%%" % v) if v is not None else "n/a")
                                       for n, v in tf)
                  lines = []
                  lines.append("NOW %s%s · %s" % (format(price, ",.1f"),
                                                  " (live)" if live is not None else " (close)",
                                                  tf_line))
                  swing_lines = _swing_lines(candles, now, price, kind)
                  if swing_lines:
                      lines.extend(swing_lines)
                  else:
                      lines.append("")
                      lines.append("No 4H swing retest near price.")
                  lines.append("Held over news: red-folder news within 5 min → take profit or tighten the stop.")
                  lines.append("feed: %s%s" % (feed_name, fallback_note))
                  if gap:
                      lines.append(gap)
                  return "GOLD SWINGS — MIDWEEK", "\n".join(lines), "SWING"
          
              # ---- NY scalp card: ranked setups, then the levels list ----
              # Simple layout with a bit of pop: the best trade up top, one compact
              # block per setup, the checklist context in two short lines.
              levels = {label: p + PRICE_OFFSET for (p, label) in items}
              raw_levels = {label: p for (p, label) in items}
              raw_price = price - PRICE_OFFSET
              atr = _atr_latest(candles)
              macd_hist = _macd_hist_latest(candles)
              vols = [c.get("v", 0) for c in candles]
              vol_ok = (len(vols) >= 21 and sum(vols[-21:-1]) > 0
                        and vols[-1] > 1.5 * (sum(vols[-21:-1]) / 20.0))
              tf = [("24h", _pct_move(candles, 96)), ("4H", _pct_move(candles, 16)),
                    ("1H", _pct_move(candles, 4)), ("15m", _pct_move(candles, 1))]
              tf_line = " | ".join("%s %s" % (n, ("%+.1f%%" % v) if v is not None else "n/a")
                                   for n, v in tf)
              orb_range = (orb[0] - orb[1]) if orb else None
              orb_ok = (orb_range is not None
                        and ORB_MIN_RANGE <= orb_range <= ORB_MAX_RANGE)
          
              # ---- Checklist context: 1H bias, 4H swings, weekly/daily trend ----
              now_ms = to_ms(now)
              h1 = _resample(candles, 60)
              h4 = _resample(candles, 240)
              h1_line = _macd_line_series(h1)
              h1_macd = h1_line[-1] if h1_line else None
              h1_h, h1_l = _last_swings(h1, bar_ms=3600 * 1000)
              h1_struct = _structure(h1, bar_ms=3600 * 1000, swings=(h1_h, h1_l))
              # Full 1H bias: MACD line and structure agree. The backtest says this
              # is the best per-trade filter (+0.17R vs +0.14R baseline) but it cuts
              # 75% of trades, so it is shown, not used as a hard gate.
              bias_1h = None
              if h1_macd is not None and h1_struct is not None:
                  if h1_macd > 0 and h1_struct == 1:
                      bias_1h = 1
                  elif h1_macd < 0 and h1_struct == -1:
                      bias_1h = -1
              h4_sw = _swing_points(h4, bar_ms=4 * 3600 * 1000)
              h4_uh, h4_ul = _unbroken(h4, h4_sw)
              d_macd = w_macd = None
              d_h = d_l = w_h = w_l = None
              d_above = None
              d_sw = []
              daily = _sane_daily(daily) if daily else None
              if daily:
                  d_line = _macd_line_series(daily)
                  d_macd = d_line[-1] if d_line else None
                  d_sw = _swing_points(daily, bar_ms=24 * 3600 * 1000)
                  d_uh, d_ul = _unbroken(daily, d_sw)
                  if d_uh:
                      d_h = d_uh[-1]["price"] + PRICE_OFFSET
                  if d_ul:
                      d_l = d_ul[-1]["price"] + PRICE_OFFSET
                  above = [s["price"] for s in d_uh if s["price"] > raw_price]
                  if above:
                      d_above = min(above) + PRICE_OFFSET
                  wk = _weekly_bars(daily)
                  wk_line = _macd_line_series(wk)
                  w_macd = wk_line[-1] if wk_line else None
                  wk_sw = _swing_points(wk, bar_ms=7 * 24 * 3600 * 1000)
                  w_uh, w_ul = _unbroken(wk, wk_sw)
                  if w_uh:
                      w_h = w_uh[-1]["price"] + PRICE_OFFSET
                  if w_ul:
                      w_l = w_ul[-1]["price"] + PRICE_OFFSET
          
              # ---- Swing levels (checklist 15m + 4H layers) ----
              # (label, price, direction, conf_ms). Only the last two 15m swings and
              # the last 4H swing of each kind, near price (within 3xATR), and only
              # ones that do not duplicate a session level.
              swing_defs = []
              if atr:
                  m15_sw = _swing_points(candles, bar_ms=15 * 60 * 1000)
                  for sw_kind, direction, tag in (("H", "long", "15m H"), ("L", "short", "15m L")):
                      recent = [s for s in m15_sw if s["kind"] == sw_kind
                                and s["conf_ms"] <= now_ms][-2:]
                      for n, s in enumerate(reversed(recent), 1):
                          if abs(s["price"] - raw_price) > 3.0 * atr:
                              continue
                          swing_defs.append(("%s%d" % (tag, n), s["price"], direction,
                                             s["conf_ms"]))
                  for sw_list, direction, tag in ((h4_uh, "long", "4H H"), (h4_ul, "short", "4H L")):
                      if not sw_list:
                          continue
                      s = sw_list[-1]
                      if abs(s["price"] - raw_price) > 3.0 * atr:
                          continue
                      swing_defs.append((tag, s["price"], direction, s["conf_ms"]))
                  session_prices = [p for p, _ in items]
                  swing_defs = [(nm, p, d, cm) for nm, p, d, cm in swing_defs
                                if all(abs(p - sp) > 0.25 * atr for sp in session_prices)]
              for nm, p, _d, _cm in swing_defs:
                  levels[nm] = p + PRICE_OFFSET
                  raw_levels[nm] = p
          
              # Plan geometry first: the SELL / BUY ZONE entries are also TP candidates
              # for every setup (a target inside an opposing zone is not a real target).
              _zo = lambda v: None if v is None else v + PRICE_OFFSET  # noqa: E731
              _plan_geoms = plan_geometry(
                  price, atr, vwap,
                  _zo(near_swing(h4_sw, "H", raw_price, True)),
                  _zo(near_swing(h4_sw, "L", raw_price, False)),
                  _zo(near_swing(d_sw, "H", raw_price, True)),
                  _zo(near_swing(d_sw, "L", raw_price, False)))
              _zone_edges = [g["entry"] for g in _plan_geoms
                             if g["label"] in ("SELL ZONE", "BUY ZONE")]
          
              def build_setup(label, direction, entry, cond, ok=True, check_ran=True,
                              invalid=None, risk_override=None, age_bars=None,
                              extra_levels=None, live_check=False, need_trend=True):
                  """A scalp setup: entry, 1xATR stop, TPs at the successive levels
                  ahead, a 0-5 score and a TRADE / NO TRADE verdict.
                  Stop rule (clamp): stop = max(ATR, 10) pts, but if the 15m ATR is
                  over 15 pts the market is too wild for a scalp - the setup is
                  NO TRADE (skip it, do not squeeze the stop to 15).
                  risk_override: an explicit stop distance in points (used by the
                  liquidity-zone setups, whose stop sits past the sweep extreme
                  plus 0.25 ATR, clamped to 10-15). The caller skips the setup
                  entirely when that distance would exceed 15.
                  check_ran only applies to breakout entries (price may already have
                  blown past the level); retest entries are pending pullbacks, so the
                  price being past the level is the setup itself, not a miss.
                  invalid is (price, "below"/"above"): a 15m close beyond it kills
                  the setup - back inside the range for an ORB breakout, through the
                  level by 0.25 ATR for a retest."""
                  if atr is None or atr <= 0:
                      return None
                  risk = risk_override if risk_override is not None else max(atr, 10.0)
                  stop = entry - risk if direction == "long" else entry + risk
                  ahead = sorted([p for p in (list(levels.values()) + list(extra_levels or []) + _zone_edges)
                                  if (p > entry if direction == "long" else p < entry)],
                                 reverse=(direction == "short"))
                  # Targets are zones, not lines: drop levels inside the entry zone
                  # (within 3 pts of entry — TP1 at 0.0R is not a target) and merge
                  # levels within 3 pts of each other, so TP1 is the first
                  # meaningful level. The furthest level (room) is unchanged unless
                  # every level ahead was in the zone.
                  _ahead = []
                  for p in ahead:
                      if abs(p - entry) < 3.0:
                          continue
                      if _ahead and abs(p - _ahead[-1]) < 3.0:
                          continue
                      _ahead.append(p)
                  ahead = _ahead
                  tps = []
                  # Only levels within MAX_TP_R of the entry are targets (nearest
                  # first, up to 4): room is measured to the last target shown.
                  for p in [x for x in ahead if abs(x - entry) <= MAX_TP_R * risk][:4]:
                      r = ((p - entry) / risk if direction == "long"
                           else (entry - p) / risk)
                      tps.append((p, r))
                  room = _room_of(tps)
                  score = 0
                  if room >= 2.0:
                      score += 2
                  elif room >= 1.0:
                      score += 1
                  if vol_ok:
                      score += 1
                  vwap_with = (vwap is not None and
                               ((direction == "long" and entry > vwap) or
                                (direction == "short" and entry < vwap)))
                  if vwap_with:
                      score += 1
                  macd_ok = (macd_hist is not None and
                             ((direction == "long" and macd_hist > 0) or
                              (direction == "short" and macd_hist < 0)))
                  if macd_ok:
                      score += 1
                  # Against the weekly, daily and 1H trend: lose a point and carry
                  # a COUNTER-TREND tag (it also ranks below with-trend setups).
                  against = counter_trend(direction, w_macd, d_macd, bias_1h)
                  if against:
                      score = max(0, score - 1)
                  reasons = []
                  if atr > 15.0:
                      reasons.append("15m ATR %.1f > 15 max — too wild, skip" % atr)
                  if not ok:
                      reasons.append("ORB range %.1f pts: SKIP" % orb_range)
                  if not tps:
                      reasons.append("no levels ahead")
                  elif room < 1.0:
                      reasons.append("room %.1fR < 1R" % room)
                  if score < 3:
                      reasons.append("score %d < 3" % score)
                  # Room + volume alone must not qualify a trade: VWAP or MACD has
                  # to agree with the direction (his zone setups are exempt - they
                  # are his own entry method, see plan_geometry).
                  if need_trend and not (vwap_with or macd_ok):
                      reasons.append("neither VWAP nor MACD agrees")
                  ran = ((price - entry) / risk if direction == "long"
                         else (entry - price) / risk)
                  if check_ran and ran > 0.5:
                      reasons.append("already ran %.1fR past entry" % ran)
                  if check_ran and ((direction == "long" and price <= stop)
                                    or (direction == "short" and price >= stop)):
                      reasons.append("price already through the stop")
                  if age_bars is not None and age_bars > MAX_SIGNAL_AGE_BARS:
                      reasons.append("signal %d min old" % (age_bars * 15))
                  # Setups judged on closed 15m candles can go stale inside a bar:
                  # a retest / sweep whose invalidation live price is already through
                  # is dead (not applied to pending breakouts, whose price is
                  # naturally on the far side of the level).
                  if live_check and invalid is not None:
                      _ip, _side = invalid
                      if (_side == "below" and price < _ip) or (_side == "above" and price > _ip):
                          reasons.append("live price already through invalidation")
                  why = ["room %.1fR%s" % (room, " 🤑" if room >= 5.0 else ""),
                         "vol ✓" if vol_ok else "vol ✗",
                         "VWAP ✓" if vwap_with else "VWAP ✗",
                         "MACD ✓" if macd_ok else "MACD ✗"]
                  if bias_1h is None:
                      why.append("1H bias ~")
                  elif ((direction == "long" and bias_1h == 1)
                        or (direction == "short" and bias_1h == -1)):
                      why.append("1H bias ✓")
                  else:
                      why.append("1H bias ✗")
                  if against:
                      why.append("COUNTER-TREND (W/D/1H)")
                  return {"label": label, "direction": direction, "entry": entry,
                          "stop": stop, "risk": risk, "tps": tps, "room": room,
                          "score": score, "trade": not reasons, "reasons": reasons,
                          "why": " · ".join(why), "cond": cond, "invalid": invalid,
                          "counter": against,
                          "pending": not label.startswith("LIQZONE")}
          
              setups = []
              if orb:
                  s = build_setup("ORB LONG", "long", levels["ORB H"],
                                  "on 15m close beyond %s" % format(levels["ORB H"], ",.1f"),
                                  ok=orb_ok, invalid=(levels["ORB H"], "below"))
                  if s:
                      setups.append(s)
                  s = build_setup("ORB SHORT", "short", levels["ORB L"],
                                  "on 15m close below %s" % format(levels["ORB L"], ",.1f"),
                                  ok=orb_ok, invalid=(levels["ORB L"], "above"))
                  if s:
                      setups.append(s)
              # Retests: levels broken after they formed, with price near them now.
              # A level counts as broken only by a close beyond it AFTER its window
              # closed (PDH/PDL 00:00, ASIA 03:00, LON 08:00, swing levels at their
              # confirmation time) - a close before the level existed does not count.
              formed_ms = _formed_times(now)
              cand_defs = []
              cand_dir = {}
              for label in ("PDH", "PDL", "ASIA H", "ASIA L", "LON H", "LON L"):
                  if label in raw_levels:
                      direction = "long" if label.endswith("H") else "short"
                      cand_defs.append((label, raw_levels[label], direction, formed_ms[label]))
                      cand_dir[label] = direction
              for nm, p, direction, cm in swing_defs:
                  cand_defs.append((nm, p, direction, cm))
                  cand_dir[nm] = direction
              broken = set()
              cands = []
              for label, lv, direction, conf_ms in cand_defs:
                  if atr is None:
                      continue
                  is_high = direction == "long"
                  broke = any((c["c"] > lv if is_high else c["c"] < lv)
                              for c in candles
                              if conf_ms <= c["t"])
                  if not broke:
                      continue
                  broken.add(label)
                  if abs(raw_price - lv) > 1.5 * atr:
                      continue
                  # Invalidated if price closed through the level by more than 0.25 ATR.
                  if is_high and min(candles[-1]["c"], raw_price) < lv - 0.25 * atr:
                      continue
                  if not is_high and max(candles[-1]["c"], raw_price) > lv + 0.25 * atr:
                      continue
                  cands.append((abs(raw_price - lv), label))
              cands.sort()
              for _, label in cands[:2]:
                  lv = levels[label]
                  if cand_dir[label] == "long":
                      s = build_setup("RETEST LONG", "long", lv, "pullback to %s" % label,
                                      check_ran=False,
                                      invalid=(lv - 0.25 * atr, "below"), live_check=True)
                  else:
                      s = build_setup("RETEST SHORT", "short", lv, "rally to %s" % label,
                                      check_ran=False,
                                      invalid=(lv + 0.25 * atr, "above"), live_check=True)
                  if s:
                      setups.append(s)
              # Liquidity zones: a session level (PDH/PDL, ASIA H/L, LON H/L) with a
              # zone above a high [level, level + 0.5 ATR] or below a low
              # [level - 0.5 ATR, level]. Price must penetrate into the zone (high
              # >= level + 0.25 ATR, or low <= level - 0.25 ATR), then a 15m candle
              # closes back outside it within 5 bars - fade it (short off a high
              # zone, long off a low zone). Stop past the furthest extreme reached
              # inside the zone + 0.25 ATR, clamped to 10-15 (skip if over 15).
              # Session levels only - EQH/EQL zones are a separate add-on, not on.
              if atr is not None:
                  for label in ("PDH", "PDL", "ASIA H", "ASIA L", "LON H", "LON L"):
                      if label not in raw_levels:
                          continue
                      lv = raw_levels[label]
                      is_high = label.endswith("H")
                      conf_ms = formed_ms[label]
                      extreme = None
                      pen_idx = None
                      for i, c in enumerate(candles):
                          if c["t"] < conf_ms:
                              continue
                          if extreme is None:
                              if is_high and c["h"] >= lv + 0.25 * atr:
                                  extreme = c["h"]
                                  pen_idx = i
                              elif not is_high and c["l"] <= lv - 0.25 * atr:
                                  extreme = c["l"]
                                  pen_idx = i
                              continue
                          if is_high:
                              extreme = max(extreme, c["h"])
                          else:
                              extreme = min(extreme, c["l"])
                          if i - pen_idx > 5:
                              break
                          closed_out = (c["c"] < lv) if is_high else (c["c"] > lv)
                          if not closed_out:
                              continue
                          entry = c["c"]
                          direction = "short" if is_high else "long"
                          stop_dist = abs(extreme - entry) + 0.25 * atr
                          entry += PRICE_OFFSET   # chart units, like price and levels
                          if stop_dist > 15.0:
                              break
                          risk_ov = max(stop_dist, 10.0)
                          cond = ("sweep above %s, close back below" % label
                                  if is_high else
                                  "sweep below %s, close back above" % label)
                          inv = ((lv + PRICE_OFFSET, "above") if is_high
                                 else (lv + PRICE_OFFSET, "below"))
                          s = build_setup("LIQZONE SHORT" if is_high else "LIQZONE LONG",
                                          direction, entry, cond,
                                          invalid=inv, risk_override=risk_ov,
                                          age_bars=len(candles) - 1 - i, live_check=True)
                          if s:
                              setups.append(s)
                          break
              # Breakdown-continuation (candidate A): a session level (PDH/PDL,
              # ASIA H/L, LON H/L) broken by the last 15m close beyond the level by
              # >= 0.25 ATR, with the live price still holding beyond the level on
              # the next (forming) bar. Enter at the live price; stop just beyond
              # the level + 0.25 ATR. Stop distance over 15 pts skips the setup and
              # the risk is floored at 10 pts, like LIQZONE. Scored like any other
              # setup (same TRADE gate, same sort + 3-pt dedup).
              if atr is not None:
                  for label in ("PDH", "PDL", "ASIA H", "ASIA L", "LON H", "LON L"):
                      if label not in raw_levels:
                          continue
                      lv = raw_levels[label]
                      is_high = label.endswith("H")
                      bc = candles[-1]["c"]
                      if is_high:
                          if bc < lv + 0.25 * atr:
                              continue
                          if raw_price <= lv:
                              continue
                          direction = "long"
                          stop_raw = lv - 0.25 * atr
                      else:
                          if bc > lv - 0.25 * atr:
                              continue
                          if raw_price >= lv:
                              continue
                          direction = "short"
                          stop_raw = lv + 0.25 * atr
                      stop_dist = abs(raw_price - stop_raw)
                      if stop_dist > 30.0:
                          continue
                      risk_ov = max(stop_dist, 10.0)
                      inv = ((lv + PRICE_OFFSET, "below") if is_high
                             else (lv + PRICE_OFFSET, "above"))
                      # Round-number TP candidates (D2): multiples of 25 in chart
                      # units, in the trade direction, inside the MAX_TP_R window.
                      # They join the normal TP ladder (nearest first, max 4) so a
                      # BREAKOUT with no real level ahead can still measure room.
                      rn = []
                      _rn_step = 25.0
                      _rn_lim = MAX_TP_R * risk_ov
                      if direction == "long":
                          _p = (price // _rn_step + 1) * _rn_step
                          while _p - price <= _rn_lim:
                              rn.append(_p)
                              _p += _rn_step
                      else:
                          _p = (price // _rn_step) * _rn_step
                          while price - _p <= _rn_lim:
                              rn.append(_p)
                              _p -= _rn_step
                      s = build_setup("BREAKOUT LONG" if is_high else "BREAKOUT SHORT",
                                      direction, price,
                                      "15m close beyond %s, holding" % label,
                                      invalid=inv, risk_override=risk_ov,
                                      extra_levels=rn, live_check=True)
                      if s:
                          setups.append(s)
              # Double-top / double-bottom rejection (candidate F2): the last
              # two confirmed 15m swing highs, the second within 5 pts of the first
              # and not exceeding it by >= 0.25 ATR, the two bars >= 4 bars apart,
              # followed by a 15m close back below the second peak minus 0.25 ATR
              # (live price also below the second peak) -> short at live price,
              # stop just above the HIGHER peak + 0.25 ATR. Mirror for bottoms.
              if atr is not None:
                  m15_sw = _swing_points(candles, bar_ms=15 * 60 * 1000)
                  for _kind, _dir, _lab in (("H", "short", "DTOP SHORT"),
                                            ("L", "long", "DBTM LONG")):
                      _pts = [s for s in m15_sw if s["kind"] == _kind
                              and s["conf_ms"] <= now_ms]
                      if len(_pts) < 2:
                          continue
                      p1, p2 = _pts[-2], _pts[-1]
                      if (p2["t"] - p1["t"]) // (15 * 60 * 1000) < 4:
                          continue
                      if _kind == "H":
                          if p2["price"] < p1["price"] - 5.0:
                              continue
                          if p2["price"] > p1["price"] + 0.25 * atr:
                              continue
                          if candles[-1]["c"] > p2["price"] - 0.25 * atr:
                              continue
                          if raw_price >= p2["price"]:
                              continue
                          direction = "short"
                          stop_raw = p1["price"] + 0.25 * atr
                          inv = (p1["price"] + PRICE_OFFSET, "above")
                      else:
                          if p2["price"] > p1["price"] + 5.0:
                              continue
                          if p2["price"] < p1["price"] - 0.25 * atr:
                              continue
                          if candles[-1]["c"] < p2["price"] + 0.25 * atr:
                              continue
                          if raw_price <= p2["price"]:
                              continue
                          direction = "long"
                          stop_raw = p1["price"] - 0.25 * atr
                          inv = (p1["price"] + PRICE_OFFSET, "below")
                      stop_dist = abs(raw_price - stop_raw)
                      if stop_dist > 30.0:
                          continue
                      risk_ov = max(stop_dist, 10.0)
                      rn = []
                      _rn_step = 25.0
                      _rn_lim = MAX_TP_R * risk_ov
                      if direction == "long":
                          _p = (price // _rn_step + 1) * _rn_step
                          while _p - price <= _rn_lim:
                              rn.append(_p)
                              _p += _rn_step
                      else:
                          _p = (price // _rn_step) * _rn_step
                          while price - _p <= _rn_lim:
                              rn.append(_p)
                              _p -= _rn_step
                      s = build_setup(_lab, direction, price,
                                      "double %s %.1f/%.1f, close back" % (
                                          "top" if _kind == "H" else "bottom",
                                          p1["price"] + PRICE_OFFSET,
                                          p2["price"] + PRICE_OFFSET),
                                      invalid=inv, risk_override=risk_ov,
                                      extra_levels=rn, live_check=True)
                      if s:
                          setups.append(s)
              # His way of choosing entries: sell/buy zones at the 4H and daily
              # highs/lows and the VWAP break (see plan_geometry). They compete with
              # the other setups for EXECUTE, and the unqualified ones lead PREPARE
              # and WATCH.
              _h4_h = (h4_uh[-1]["price"] + PRICE_OFFSET) if h4_uh else None
              _h4_l = (h4_ul[-1]["price"] + PRICE_OFFSET) if h4_ul else None
              _extras = [x for x in (
                  vwap, w_h, w_l, d_h, d_l, _h4_h, _h4_l,
                  (h1_h[0] + PRICE_OFFSET) if h1_h else None,
                  (h1_l[0] + PRICE_OFFSET) if h1_l else None) if x is not None]
              plan_setups = []
              for g in _plan_geoms:
                  s = build_setup(g["label"], g["direction"], g["entry"], g["cond"],
                                  check_ran=False, invalid=g["invalid"],
                                  risk_override=g["risk"], extra_levels=_extras,
                                  need_trend=False)
                  if s:
                      s["inval"] = g["inval_alert"]
                      plan_setups.append(s)
                      # Only a setup price is AT (on the entry, or inside its zone)
                      # can be EXECUTE; the others are PREPARE/WATCH with an alert.
                      _z = g.get("zone")
                      _at = (abs(price - g["entry"]) <= AT_ENTRY_PTS
                             or (_z is not None
                                 and _z[0] - AT_ENTRY_PTS <= price <= _z[1] + AT_ENTRY_PTS))
                      if _at:
                          setups.append(s)
              setups.sort(key=lambda s: (not s["trade"], s.get("counter", False),
                                         -s["score"], -s["room"]))
          
              # 3-pt minimum gap between setup entries (his rule): entries within
              # 3 pts are the same zone, so keep only the best-ranked one per zone.
              # TOP first (live setups), then WATCH is deduped against TOP + WATCH.
              _GAP = 3.0
              _kept_entries = []
              _deduped = []
              for s in setups:
                  if all(abs(s["entry"] - e) >= _GAP for e in _kept_entries):
                      _deduped.append(s)
                      _kept_entries.append(s["entry"])
              setups = _deduped
          
              # WATCH: levels not broken yet, with the full plan for when they break.
              # Nearest four to price, within 3xATR. The ORB levels are already TOP
              # breakout setups, so they are not listed here.
              watch_defs = []
              for label, lv, direction, _cm in cand_defs:
                  if label in broken or label.startswith("ORB"):
                      continue
                  if atr is None or abs(raw_price - lv) > 3.0 * atr:
                      continue
                  watch_defs.append((abs(raw_price - lv), label, lv, direction))
              watch_defs.sort()
              watch_setups = []
              for _d, label, lv, direction in watch_defs[:4]:
                  if direction == "long":
                      s = build_setup("WATCH " + label, "long", levels[label],
                                      "if 15m closes above %s, then pullback" % format(levels[label], ",.1f"),
                                      check_ran=False,
                                      invalid=(levels[label] - 0.25 * atr, "below"))
                  else:
                      s = build_setup("WATCH " + label, "short", levels[label],
                                      "if 15m closes below %s, then rally" % format(levels[label], ",.1f"),
                                      check_ran=False,
                                      invalid=(levels[label] + 0.25 * atr, "above"))
                  if s:
                      watch_setups.append(s)
              # Same 3-pt gap for WATCH, checked against TOP entries too.
              _wd = []
              for s in watch_setups:
                  if all(abs(s["entry"] - e) >= _GAP for e in _kept_entries):
                      _wd.append(s)
                      _kept_entries.append(s["entry"])
              watch_setups = _wd
              # Plan setups (zones, VWAP break) that are not the EXECUTE trade come
              # first, nearest to price first; the level-break watches follow.
              _best_pre = next((s for s in setups if s["trade"]), None)
              _pool = sorted([s for s in plan_setups if s is not _best_pre],
                             key=lambda s: abs(s["entry"] - price)) + watch_setups
              watch_setups = []
              _seen_e = [_best_pre["entry"]] if _best_pre is not None else []
              for s in _pool:
                  if all(abs(s["entry"] - e) >= _GAP for e in _seen_e):
                      watch_setups.append(s)
                      _seen_e.append(s["entry"])
          
              def _lab_of(s):
                  return (s["label"][len("WATCH "):]
                          if s["label"].startswith("WATCH ") else s["label"])
          
              def _dev_header(s):
                  # PREPARE / WATCH header: the score, and a flag when below the gate.
                  return "%s %d/5%s (%s)" % (
                      s["label"], s["score"], "" if s["trade"] else " · below gate", s["cond"])
          
              lines = []
              lines.append("NOW %s%s · %s" % (format(price, ",.1f"),
                                              " (live)" if live is not None else " (close)",
                                              tf_line))
              if partial:
                  lines.append("London levels are partial (session still open)")
              # Context: weekly/daily MACD arrows, 1H bias, 4H swings, W/D swings.
              def _arrow(v):
                  if v is None:
                      return "n/a"
                  return "↑" if v > 0 else "↓"
              ctx1 = ["W %s" % _arrow(w_macd), "D %s" % _arrow(d_macd)]
              if h1_macd is not None:
                  st = "(HH/HL)" if h1_struct == 1 else ("(LH/LL)" if h1_struct == -1 else "(mixed)")
                  ctx1.append("1H MACD%s %s" % ("↑" if h1_macd > 0 else "↓", st))
              else:
                  ctx1.append("1H n/a")
              if h4_uh or h4_ul:
                  ctx1.append("4H H %s L %s" % (
                      format(h4_uh[-1]["price"] + PRICE_OFFSET, ",.1f") if h4_uh else "n/a",
                      format(h4_ul[-1]["price"] + PRICE_OFFSET, ",.1f") if h4_ul else "n/a"))
              lines.append("Context: " + " · ".join(ctx1))
              if daily is None:
                  lines.append("W/D swings: daily bars unavailable")
              else:
                  ctx2 = []
                  if w_h is not None or w_l is not None:
                      ctx2.append("W H %s / L %s" % (
                          format(w_h, ",.1f") if w_h is not None else "n/a",
                          format(w_l, ",.1f") if w_l is not None else "n/a"))
                  if d_h is not None or d_l is not None:
                      ctx2.append("D H %s / L %s" % (
                          format(d_h, ",.1f") if d_h is not None else "n/a",
                          format(d_l, ",.1f") if d_l is not None else "n/a"))
                  if d_above is not None and (d_h is None or abs(d_above - d_h) >= 0.05):
                      ctx2.append("D next H above %s" % format(d_above, ",.1f"))
                  if ctx2:
                      lines.append(" · ".join(ctx2))
              _vs, _vr, _vspike = vol_state(candles)
              _vl = vol_line(_vs, _vr)
              if _vl:
                  lines.append(_vl)
              if news:
                  lines.append(news[0])
              lines.append("")
              # Colour for a markup level, per the Gold Daily Checklist colour key:
              # weekly purple, daily orange, 4H yellow, 1H blue, 15m green. The card
              # is plain text (ntfy), so the colour is written as a word — it tells
              # him which colour to draw the line in TradingView.
              def _level_colour(label):
                  if label.startswith("W "):
                      return "purple"
                  if label.startswith("D "):
                      return "orange"
                  if label.startswith("4H "):
                      return "yellow"
                  if label.startswith("1H "):
                      return "blue"
                  if label.startswith("15m"):
                      return "green"
                  if label.startswith(("ASIA", "LON")):
                      return "green"
                  return ""
          
              # Markup levels (the chart markup for the day, per the Gold Daily
              # Checklist line budget): weekly 1, daily 2, 4H 2, 1H 2, 15m up to 4.
              # (ORB H/L are NOT listed here: they are the 08:00 15m candle's
              # high/low, already known. They still exist as ORB LONG/SHORT setup
              # entries, and the ORB range line is printed separately.)
              # the 4H swing level; in text it shows as the level line. All prices
              # here are offset, matching `price`.
              markup = []
              # Weekly: nearest unbroken weekly swing (1 line).
              _w = [(abs(p - price), p, lab) for p, lab in ((w_h, "W H"), (w_l, "W L"))
                    if p is not None]
              if _w:
                  _d, _p, _lab = min(_w)
                  markup.append((_p, _lab))
              # Daily: nearest unbroken daily swing high and low (2 lines).
              if d_h is not None:
                  markup.append((d_h, "D H"))
              if d_l is not None:
                  markup.append((d_l, "D L"))
              # 4H: last unbroken 4H swing high and low (2 lines).
              if h4_uh:
                  markup.append((h4_uh[-1]["price"] + PRICE_OFFSET, "4H H"))
              if h4_ul:
                  markup.append((h4_ul[-1]["price"] + PRICE_OFFSET, "4H L"))
              # 1H: last 1H swing high and low (2 lines).
              if h1_h:
                  markup.append((h1_h[0] + PRICE_OFFSET, "1H H"))
              if h1_l:
                  markup.append((h1_l[0] + PRICE_OFFSET, "1H L"))
              # 15m: nearest 4 of the 15m swings. (ASIA/LON H/L are NOT listed
              # here: they are session levels he already marks on his chart. They
              # still exist internally for retest/LIQZONE setups and print as setup
              # entries when they are a live decision.)
              _f15 = []
              for nm, p, _dir, _cm in swing_defs:
                  if nm.startswith("15m"):
                      _f15.append((abs(p + PRICE_OFFSET - price), p + PRICE_OFFSET, nm))
              _f15.sort(key=lambda x: x[0])
              for _d, _p, _lab in _f15[:4]:
                  markup.append((_p, _lab))
              # Sort by price (highest first), dedupe identical prices.
              markup.sort(key=lambda x: -x[0])
              _seen = set()
              _dedup = []
              for _p, _lab in markup:
                  _k = round(_p, 1)
                  if _k in _seen:
                      continue
                  _seen.add(_k)
                  _dedup.append((_p, _lab))
              markup = _dedup
              markup = [m for m in markup if abs(m[0] - price) <= KEY_LEVEL_REACH]
              # Line budget: about 10 objects. Always keep the weekly and daily
              # lines (the context), then fill the rest with the nearest 4H/1H/15m
              # levels until 10 total.
              _keep_wd = [m for m in markup if m[1].startswith(("W ", "D "))]
              _rest = sorted([m for m in markup if not m[1].startswith(("W ", "D "))],
                             key=lambda x: abs(x[0] - price))
              markup = sorted(_keep_wd + _rest[:max(0, 10 - len(_keep_wd))],
                              key=lambda x: -x[0])
              # Three priority trade decisions.
              # EXECUTE: the qualified setup (score >= 3, room >= 1R, gates pass).
              # PREPARE: the developing setup closest to confirmation.
              # WATCH: the next meaningful level where a new opportunity could emerge.
              best = next((s for s in setups if s["trade"]), None)
              at_entry = best is not None and abs(price - best["entry"]) <= AT_ENTRY_PTS
              if best is not None:
                  if at_entry and best.get("pending"):
                      lines.append("⚡ EXECUTE — AT TRIGGER, WAIT FOR CLOSE (%s)" % best["cond"])
                  elif at_entry:
                      lines.append("⚡ EXECUTE — AT ENTRY NOW (%s)" % best["cond"])
                  elif best.get("pending"):
                      lines.append("⚡ EXECUTE — WAIT FOR TRIGGER (%s)" % best["cond"])
                  else:
                      lines.append("⚡ EXECUTE")
                  lines.extend(_setup_block(
                      best, "%s 🟢 TRADE · %d/5" % (best["label"], best["score"])))
              elif setups:
                  # No ORB mentions unless it is a live trade: when the top setup
                  # is an ORB setup that did not qualify, say only that there is
                  # no qualified setup (the range/score reason stays in the
                  # monitor signature, not on the card).
                  if setups[0]["label"].startswith("ORB"):
                      lines.append("⚡ EXECUTE — no qualified setup")
                  else:
                      lines.append("⚡ EXECUTE — no qualified setup: top %s (%s)" % (
                          setups[0]["label"], "; ".join(setups[0]["reasons"])))
              else:
                  lines.append("⚡ EXECUTE — no setup")
              # The TradingView alerts: ONLY qualified trade opportunities.
              # EXECUTE entry (a qualified setup), PREPARE trigger (a developing
              # setup), WATCH (the next developing setup). No fillers: an ordinary
              # level is never promoted to an alert, and no management slot —
              # stop and take-profit fire on their own on TradeLocker, so no
              # TradingView slot is spent on them. If fewer than 3 decisions
              # exist, fewer alerts are listed (possibly none).
              _cands = []
              if best is not None:
                  _cands.append((best["entry"], best["label"], best))
              # Qualified setups first, so they win the alert slots.
              for _s in sorted(watch_setups[:2], key=lambda x: not x["trade"]):
                  _cands.append((_s["entry"], _lab_of(_s), _s))
              alert_levels = select_alerts(price, _cands)
              if decisions is not None:
                  # What this card showed, for the paper outcome log.
                  if best is not None:
                      decisions.append(_signal_of(best, "EXEC", now))
                  for _p, _lab, _s in alert_levels:
                      if "score" in _s and _s is not best:
                          decisions.append(_signal_of(_s, "ALERT", now))
              if alert_levels:
                  lines.append("🔔 ALERTS — set %d in TradingView "
                               "(trigger prices of the decisions)" % len(alert_levels))
                  for i, (p, lab, _s) in enumerate(alert_levels, 1):
                      _tag = " ".join(x for x in (
                          _level_colour(lab),
                          ("%d/5" % _s["score"]) if "score" in _s else "") if x)
                      lines.append("%d. %s  %-6s %-7s %+.0f" % (
                          i, format(p, ",.1f"), lab, _tag, p - price))
              elif at_entry:
                  lines.append("🔔 ALERTS — none needed, price is at the entry: "
                               "act on the EXECUTE card")
              elif any(abs(_c[0] - price) > ALERT_MAX_DIST for _c in _cands):
                  lines.append("🔔 ALERTS — none within %d pts of price, "
                               "nothing to set" % int(ALERT_MAX_DIST))
              else:
                  lines.append("🔔 ALERTS — no qualified setups right now, "
                               "nothing to set")
              lines.append("")
              if watch_setups:
                  lines.append("🔶 PREPARE")
                  lines.extend(_setup_block(watch_setups[0], _dev_header(watch_setups[0])))
              else:
                  lines.append("🔶 PREPARE — no developing setup")
              lines.append("")
              _nxt = None
              if len(watch_setups) > 1:
                  lines.append("👀 WATCH")
                  lines.extend(_setup_block(watch_setups[1], _dev_header(watch_setups[1])))
              else:
                  # Next meaningful level: nearest markup level not already used
                  # by PREPARE. A break there opens a new opportunity.
                  _used = _lab_of(watch_setups[0]) if watch_setups else None
                  _nxt = next((m for m in sorted(markup, key=lambda x: abs(x[0] - price))
                               if m[1] != _used), None)
                  if _nxt is not None:
                      lines.append("👀 WATCH — next level %s %s %+.0f" % (
                          format(_nxt[0], ",.1f"), _nxt[1], _nxt[0] - price))
                  else:
                      lines.append("👀 WATCH — no further level")
              lines.append("")
              lines.append("Key levels")
              # The day's chart markup (Gold Daily Checklist line budget): weekly 1,
              # daily 2, 4H 2, 1H 2, 15m up to 4. `markup` was computed above,
              # before EXECUTE, so the ALERTS and this list always agree. NOW is merged
              # in by price so the list reads top to bottom.
              _kl = sorted(markup + [(price, "NOW")], key=lambda x: -x[0])
              for p, label in _kl:
                  if label == "NOW":
                      tag = " (live)" if live is not None else " (close)"
                      lines.append("%s  >>> NOW%s <<<" % (format(p, ",.1f"), tag))
                  else:
                      lines.append("%s  %-6s %-7s %+.0f" % (
                          format(p, ",.1f"), label, _level_colour(label), p - price))
              if kind == "SUNDAY":
                  # Swing section (4H setups, held days/weeks): at most 1 per send,
                  # so Sunday + Wednesday caps at 2/week. Skipped when alerts are
                  # off or no 4H level is being retested near price.
                  lines.extend(_swing_lines(candles, now, price, kind))
              lines.append(_feed_line(feed_name, fallback_note, priced_at,
                                      price - PRICE_OFFSET))
              if gap:
                  lines.append(gap)
              # Decision signature for the 15-min monitor: only the three
              # decisions, not the whole card (price and levels move constantly).
              if best is not None:
                  _sig_e = "EXECUTE:%s|%.1f|%.1f|%d|TRADE" % (
                      best["label"], best["entry"], best["stop"], best["score"])
              elif setups:
                  _sig_e = "EXECUTE:none:%s|%s" % (
                      setups[0]["label"], ";".join(setups[0]["reasons"]))
              else:
                  _sig_e = "EXECUTE:none"
              def _sig_e_txt(s):
                  # VWAP moves every bar: its label alone keeps the monitor from
                  # sending a new card every 15 minutes.
                  if s["label"].startswith("VWAP"):
                      return s["label"]
                  return "%s|%.1f" % (s["label"], s["entry"])
              if watch_setups:
                  _sig_p = "PREPARE:%s" % _sig_e_txt(watch_setups[0])
              else:
                  _sig_p = "PREPARE:none"
              if len(watch_setups) > 1:
                  _sig_w = "WATCH:%s" % _sig_e_txt(watch_setups[1])
              elif _nxt is not None:
                  _sig_w = "WATCH:level:%.1f|%s" % (_nxt[0], _nxt[1])
              else:
                  _sig_w = "WATCH:none"
              sig = ";".join((_sig_e, _sig_p, _sig_w))
              if news:
                  sig += ";NEWS:%s" % news[1]
              if kind == "SUNDAY":
                  # Week-open levels on top (the plain levels layout from the old
                  # Sunday card), then the scalp decisions.
                  _top = []
                  for p, label in _sun_rows:
                      if label == "NOW":
                          tag = " (live)" if live is not None else " (close)"
                          _top.append("%s  >>> NOW%s <<<" % (format(p, ",.1f"), tag))
                      else:
                          _top.append("%s  %-6s %+.0f" % (format(p, ",.1f"), label, p - price))
                  _top.append("Levels are from the last full session.")
                  _top.append("")
                  lines = _top + lines
                  return "GOLD WEEK OPEN", "\n".join(lines), sig
              return "GOLD SCALPS NY", "\n".join(lines), sig
          
          
          # ============================ NTFY ============================
          def _ntfy_request(title, body, priority=3, tags="chart_with_upwards_trend"):
              """JSON publish. HTTP headers are latin-1 only, so a Title header holding
              an em dash (the Wednesday "GOLD SWINGS — MIDWEEK" card) raised
              UnicodeEncodeError and the card was never sent. A JSON body is UTF-8."""
              payload = {"topic": NTFY_TOPIC, "title": title, "message": body,
                         "priority": int(priority),
                         "tags": [t for t in tags.split(",") if t]}
              req = urllib.request.Request(
                  NTFY_SERVER + "/",
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              if NTFY_TOKEN:
                  req.add_header("Authorization", "Bearer " + NTFY_TOKEN)
              return req
          
          
          def send_ntfy(title, body, priority=3, tags="chart_with_upwards_trend"):
              print("----- %s -----" % title)
              print(body)
              if not NTFY_TOPIC:
                  print("NTFY_TOPIC is not set, so nothing was sent.")
                  return False
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(
                              _ntfy_request(title, body, priority, tags), timeout=20) as resp:
                          print("ntfy status:", resp.status)
                      return True
                  except Exception as e:  # noqa: BLE001
                      print("ntfy send failed (try %d):" % (attempt + 1), type(e).__name__, e)
                      if attempt == 0:
                          _time.sleep(2)
              return False
          
          
          # ============================ OUTCOME TRACKER ============================
          # Paper results of what the card showed (no orders are placed). Open signals
          # and closed outcomes live in gold-state.json, so no workflow change is needed.
          OUTCOME_KEEP = 200            # closed outcomes kept
          SIGNAL_OPEN_MAX = 20          # open signals kept
          LIVE_MAX_BARS = 24            # a filled setup is closed out after 6 hours
          DEDUPE_MIN = 180              # a setup that just closed is not logged again
          _FAMILIES = ("VWAP BREAK", "SELL ZONE", "BUY ZONE", "ORB", "RETEST",
                       "LIQZONE", "WATCH")
          
          
          def _floor15(ms):
              return (ms // CANDLE_MS) * CANDLE_MS
          
          
          def _is_breakout(label):
              return label.startswith(("ORB", "VWAP BREAK"))
          
          
          def _signal_of(s, stage, now):
              """A setup dict from make_card as a JSON-safe signal record."""
              return {"label": s["label"], "dir": s["direction"],
                      "entry": round(s["entry"], 2), "stop": round(s["stop"], 2),
                      "risk": round(s["risk"], 2),
                      "tps": [round(p, 2) for p, _r in s["tps"]],
                      "pending": bool(s.get("pending")),
                      "invalid": ([round(s["invalid"][0], 2), s["invalid"][1]]
                                  if s.get("invalid") else None),
                      "score": s["score"], "trade": bool(s["trade"]),
                      "counter": bool(s.get("counter")), "stage": stage,
                      "t": to_ms(now), "off": PRICE_OFFSET}
          
          
          def _init_signal(d):
              """Start state: pending setups wait for their trigger; LIQZONE entries are
              already triggered and fill at the entry price at once."""
              if d["pending"]:
                  d["state"] = "wait"
                  d["last_t"] = _floor15(d["t"]) - CANDLE_MS   # the candle open at card time counts
              else:
                  d.update(state="live", fill=d["entry"], rr=d["risk"], fill_t=d["t"], hit=0,
                           last_t=_floor15(d["t"]))            # first candle after the card
              return d
          
          
          def record_signals(decisions, now):
              """Add this card's decisions to the open signals (skipping repeats of an
              open signal or of one that closed within DEDUPE_MIN minutes)."""
              if not decisions:
                  return
              st = _load_state()
              sigs = st.get("signals") if isinstance(st.get("signals"), list) else []
              outs = st.get("outcomes") if isinstance(st.get("outcomes"), list) else []
              now_ms = to_ms(now)
              changed = False
              for d in decisions:
                  def same(x):
                      return (x.get("label") == d["label"] and x.get("dir") == d["dir"]
                              and abs(x.get("entry", -1e9) - d["entry"]) <= 5.0)
                  dup = next((x for x in sigs if same(x)), None)
                  if dup is not None:
                      if d["stage"] == "EXEC" and dup.get("stage") != "EXEC":
                          dup["stage"] = "EXEC"
                          changed = True
                      continue
                  if any(x.get("label") == d["label"] and x.get("dir") == d["dir"]
                         and now_ms - x.get("t", 0) <= DEDUPE_MIN * 60 * 1000
                         for x in outs):
                      continue
                  sigs.append(_init_signal(d))
                  changed = True
              if changed:
                  _save_state(signals=sigs[-SIGNAL_OPEN_MAX:])
          
          
          def _outcome(sig, kind, cl=None):
              """Close a signal out. R is measured from the fill with the real risk (the
              stop's distance from the fill). A signal that never filled scores 0."""
              out = {k: sig[k] for k in ("label", "dir", "stage", "trade", "score",
                                         "counter", "t") if k in sig}
              out["outcome"] = kind
              filled = sig.get("state") == "live"
              out["triggered"] = filled
              out["r_tp1"] = out["r_best"] = 0.0
              if filled and sig.get("rr"):
                  rr, fill, tps = sig["rr"], sig["fill"], sig["tps"]
                  short = sig["dir"] == "short"
          
                  def r_of(p):
                      return ((fill - p) if short else (p - fill)) / rr
                  if kind == "stop":
                      out["r_tp1"] = out["r_best"] = -1.0
                  elif kind.startswith("tp") and tps:
                      k = max(1, min(int(kind[2:]), len(tps)))
                      out["r_tp1"], out["r_best"] = r_of(tps[0]), r_of(tps[k - 1])
                  elif cl is not None:
                      out["r_tp1"] = out["r_best"] = ((fill - cl) if short else (cl - fill)) / rr
              out["r_tp1"], out["r_best"] = round(out["r_tp1"], 2), round(out["r_best"], 2)
              return out
          
          
          def resolve_signal(sig, candles):
              """Advance one open signal through the completed candles after its
              last_t. Returns the outcome dict when it is finished, else None (the
              signal is updated in place)."""
              off, short = sig["off"], sig["dir"] == "short"
              for c in candles:
                  if c["t"] <= sig["last_t"]:
                      continue
                  sig["last_t"] = c["t"]
                  hi, lo, cl = c["h"] + off, c["l"] + off, c["c"] + off
                  t_close = c["t"] + CANDLE_MS
                  if sig["state"] == "wait":
                      if t_close - sig["t"] > MAX_SIGNAL_AGE_BARS * CANDLE_MS:
                          return _outcome(sig, "no_trigger")
                      inv = sig.get("invalid")
                      if inv and ((inv[1] == "above" and cl > inv[0])
                                  or (inv[1] == "below" and cl < inv[0])):
                          return _outcome(sig, "invalidated")
                      e = sig["entry"]
                      if _is_breakout(sig["label"]):
                          trig = (cl < e) if short else (cl > e)
                      else:
                          trig = (hi >= e and cl < e) if short else (lo <= e and cl > e)
                      if not trig:
                          continue
                      slack = min(MAX_CHASE_PTS, max(0.0, MAX_STOP_PTS - sig["risk"]))
                      beyond = (e - cl) if short else (cl - e)
                      rr = (sig["stop"] - cl) if short else (cl - sig["stop"])
                      if rr <= 0 or rr > MAX_STOP_PTS or beyond > slack + 1e-9:
                          return _outcome(sig, "skipped_chase")
                      sig.update(state="live", fill=cl, rr=rr, fill_t=t_close, hit=0,
                                 tps=[p for p in sig["tps"] if (p < cl if short else p > cl)])
                      continue
                  stop, tps, hit = sig["stop"], sig["tps"], sig["hit"]
                  if (hi >= stop) if short else (lo <= stop):
                      # Stop first when one candle touches both: the cautious reading.
                      return _outcome(sig, "stop" if hit == 0 else "tp%d" % hit)
                  while hit < len(tps) and ((lo <= tps[hit]) if short else (hi >= tps[hit])):
                      hit += 1
                  sig["hit"] = hit
                  if tps and hit == len(tps):
                      return _outcome(sig, "tp%d" % hit)
                  if t_close - sig["fill_t"] >= LIVE_MAX_BARS * CANDLE_MS:
                      return _outcome(sig, "tp%d" % hit if hit else "open", cl)
              return None
          
          
          def track_signals(candles, now):
              """Resolve every open signal against the latest candles; save when
              anything moved."""
              st = _load_state()
              sigs = st.get("signals")
              if not isinstance(sigs, list) or not sigs:
                  return
              outs = st.get("outcomes") if isinstance(st.get("outcomes"), list) else []
              keep, changed = [], False
              for sig in sigs:
                  before = (sig.get("last_t"), sig.get("state"), sig.get("hit"))
                  try:
                      res = resolve_signal(sig, candles)
                  except Exception as e:  # noqa: BLE001 - one bad record must not stop the rest
                      print("Outcome error:", type(e).__name__, e)
                      res = _outcome(sig, "error")
                  if res is not None:
                      outs.append(res)
                      changed = True
                      print("Outcome: %s %s -> %s (R1 %+.2f, best %+.2f)" % (
                          res.get("label"), res.get("dir"), res["outcome"],
                          res["r_tp1"], res["r_best"]))
                  else:
                      keep.append(sig)
                      if (sig.get("last_t"), sig.get("state"), sig.get("hit")) != before:
                          changed = True
              if changed:
                  _save_state(signals=keep, outcomes=outs[-OUTCOME_KEEP:])
          
          
          def _family(label):
              for f in _FAMILIES:
                  if label.startswith(f):
                      return f
              return label.split()[0] if label.split() else "?"
          
          
          def _agg(rows):
              """One line of results for a list of outcomes."""
              fired = [o for o in rows if o.get("triggered")]
              wins = [o for o in fired if str(o.get("outcome", "")).startswith("tp")]
              txt = "%d sig, %d fired" % (len(rows), len(fired))
              if fired:
                  txt += " · win %d/%d (%d%%) · R1 %+.2f · best %+.2f" % (
                      len(wins), len(fired), round(100.0 * len(wins) / len(fired)),
                      sum(o["r_tp1"] for o in fired) / len(fired),
                      sum(o["r_best"] for o in fired) / len(fired))
              return txt
          
          
          def outcome_stats(outs):
              """Plain-text summary of the closed paper outcomes."""
              outs = [o for o in outs if isinstance(o, dict) and o.get("outcome") != "error"]
              if not outs:
                  return ("No outcomes yet. Signals are logged when a card is sent and "
                          "closed out as candles arrive.")
              lines = ["ALL: " + _agg(outs), "", "By setup"]
              fams = {}
              for o in outs:
                  fams.setdefault(_family(o.get("label", "?")), []).append(o)
              for f, rows in sorted(fams.items(), key=lambda kv: -len(kv[1])):
                  lines.append("%s: %s" % (f, _agg(rows)))
              lines += ["", "Gate: " + "; ".join(
                  "%s %s" % (n, _agg([o for o in outs if f(o)]))
                  for n, f in (("3/5+", lambda o: o.get("trade")),
                               ("below", lambda o: not o.get("trade"))))]
              lines.append("Trend: " + "; ".join(
                  "%s %s" % (n, _agg([o for o in outs if f(o)]))
                  for n, f in (("with", lambda o: not o.get("counter")),
                               ("counter", lambda o: o.get("counter")))))
              lines.append("Stage: " + "; ".join(
                  "%s %s" % (n, _agg([o for o in outs if o.get("stage") == n]))
                  for n in ("EXEC", "ALERT")))
              kinds = {}
              for o in outs:
                  kinds[o["outcome"]] = kinds.get(o["outcome"], 0) + 1
              lines += ["", "Closed as: " + ", ".join(
                  "%s %d" % (k, v) for k, v in sorted(kinds.items(), key=lambda kv: -kv[1]))]
              lines.append("R1 = R if everything is taken at TP1; best = R at the best TP "
                           "reached before the stop. A candle touching both stop and "
                           "target counts as a stop.")
              return "\n".join(lines)
          
          
          def outcomes():
              """MODE=outcomes: send the paper-outcome summary."""
              outs = _load_state().get("outcomes")
              text = outcome_stats(outs if isinstance(outs, list) else [])
              return 0 if send_ntfy("GOLD OUTCOMES", text) else 1
          
          
          # ============================ MODES ============================
          def feedcheck():
              results = fetch_all_feeds()
              lines = []
              ok = []
              ref = None
              for r in results:
                  p = price_of(r)
                  if r["candles"] is not None and p is not None:
                      _at = r.get("fetched_at")
                      lines.append("%s: %s (%d candles) @%s ET" % (
                          r["name"], format(p, ",.2f"), len(r["candles"]),
                          _at.strftime("%H:%M:%S") if _at else "?"))
                      _q = r.get("quote")
                      if _q:
                          lines.append("   bid %s / ask %s (spread %.2f)" % (
                              format(_q[0], ",.2f"), format(_q[1], ",.2f"), _q[1] - _q[0]))
                      ok.append(r)
                      if r["name"].startswith("OANDA"):
                          ref = p
                  else:
                      lines.append("%s: FAILED (%s)" % (r["name"], r["error"]))
              if ref is not None:
                  for r in ok:
                      if r["name"].startswith("OANDA"):
