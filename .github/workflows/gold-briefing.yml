              decisions = [] if (kind == "NY" and not FORCE) else None
              title, body, sig = make_card(active["candles"], active["live"], now, kind,
                                           active["name"], fallback_note, gap_line(results),
                                           daily=daily, priced_at=active.get("fetched_at"),
                                           news=news, decisions=decisions)
