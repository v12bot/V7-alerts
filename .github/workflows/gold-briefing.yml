                         _e1[1] and _e2[1] and _n_after_10 == 1 and len(_calls) == 2)
              finally:
                  globals()["STATE_FILE"], globals()["http_get"], globals()["NEWS_FILTER"] = _sf2, _hg, _nf
                  if os.path.exists(_tmp2.name):
                      os.unlink(_tmp2.name)
          
              print("SELFTEST PASS" if ok else "SELFTEST FAIL")
              return 0 if ok else 1
          
          
          def scorecard():
              """MODE=scorecard: send the two test cards in scorecard.txt
              (repo root) to ntfy, one message each. Manual runs only — the
              file is a fixed snapshot, not a live card. Returns 1 when the
              file is missing or a send fails."""
              path = os.path.join(os.getcwd(), "scorecard.txt")
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      text = f.read()
              except OSError as e:
                  print("scorecard.txt not found:", e)
                  return 1
              marker = "TEST CARD 2"
              idx = text.find(marker)
              if idx < 0:
                  print("scorecard.txt has no TEST CARD 2 section.")
                  return 1
          
              def _clean(part):
                  return "\n".join(
                      ln for ln in part.splitlines()
                      if ln.strip().strip("=") != "").strip()
          
              card1 = _clean(text[:idx])
              card2 = _clean(text[idx:])
              ok1 = send_ntfy("GOLD SCORECARD 1/2", card1)
              ok2 = send_ntfy("GOLD SCORECARD 2/2", card2)
              return 0 if (ok1 and ok2) else 1
          
          
          def main():
              if MODE == "feedcheck":
                  return feedcheck()
              if MODE == "selftest":
                  return selftest()
              if MODE == "scorecard":
                  return scorecard()
              if MODE == "outcomes":
                  return outcomes()
              return briefing()
          
          
          if __name__ == "__main__":
              sys.exit(main())
          
          
