          def market_open(now):
              """Spot gold hours (ET): Sun 18:00 to Fri 17:00, with a daily break
              17:00-18:00 Mon-Thu."""
              wd, mins = now.weekday(), now.hour * 60 + now.minute
              if wd == 5:
                  return False
              if wd == 6:
                  return mins >= 18 * 60
              if wd == 4:
                  return mins < 17 * 60
              return not (17 * 60 <= mins < 18 * 60)
          
          
          def _swing_alert(candles, live, now):
              """All-day swing check: sends a GOLD SWING card only when a 4H swing
              setup passes the gate (TRADE) and differs from the last one sent
              today. Never sends a 'nothing' card."""
              if not SWING_ALERTS:
                  return
              price = (live if live is not None else candles[-1]["c"]) + PRICE_OFFSET
              swing = get_swing_setups(candles, now, price - PRICE_OFFSET, "SWING")
              best = next((s for s in swing if s["trade"]), None)
              if best is None:
                  return
              sig = "SWING:%s|%.1f|%.1f|%d" % (
                  best["label"], best["entry"], best["stop"], best["score"])
              st = _load_state()
              today = now.date().isoformat()
              if st.get("swing_sig") == sig and st.get("swing_date") == today:
                  return
              lines = ["NOW %s" % format(price, ",.1f")]
              lines.extend(_setup_block(
                  best, "%s 🟢 TRADE · %d/5" % (best["label"], best["score"])))
              lines.append("Held over news: red-folder news within 15 min → take profit or tighten the stop.")
              if send_ntfy("GOLD SWING", "\n".join(lines)):
                  _save_state(swing_sig=sig, swing_date=today)
          
          
          def briefing():
              global PRICE_OFFSET
              now = datetime.now(ET)
              mins = now.hour * 60 + now.minute
              kind = None
              if FORCE:
                  if now.weekday() == 2 and mins >= SWING_WINDOW[0]:
                      kind = "SWING"
                  else:
                      kind = "SUNDAY" if (now.weekday() == 6 and mins >= SUNDAY_WINDOW[0]) else "NY"
              elif now.weekday() == 6 and SUNDAY_WINDOW[0] <= mins <= SUNDAY_WINDOW[1]:
                  kind = "SUNDAY"
              elif market_open(now):
                  kind = "NY"
              else:
                  print("Gold market closed. Nothing sent.")
                  return 0
          
              now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
              active, results = fetch_first_fresh(kind, now_ms)
              if active is None:
                  errors = ["%s: %s" % (r["name"], r["error"]) for r in results]
                  # Scheduled runs happen all day: one failure notice per hour at most.
                  st = _load_state()
                  last_fail = st.get("fail_at")
                  recent = False
                  if last_fail and not FORCE:
                      try:
                          recent = (now - datetime.fromisoformat(last_fail)) < timedelta(hours=1)
                      except Exception:
                          recent = False
                  if recent:
                      print("No feed responded (failure notice already sent this hour).")
                      return 1
                  send_ntfy("GOLD BRIEFING FAILED",
                            "No price feed responded.\n" + "\n".join(errors),
                            priority=4, tags="warning")
                  _save_state(fail_at=now.isoformat())
                  return 1
          
              # The offset belongs to the feed that prices the card (see _offset_for).
              PRICE_OFFSET = _offset_for(active)
              if not active["fallback"]:
                  fallback_note = ""
              elif PRICE_OFFSET_FALLBACK is not None:
                  fallback_note = " (fallback)"
              else:
                  fallback_note = (" (fallback - offset %+.2f is calibrated for OANDA, "
                                   "not this feed)" % PRICE_OFFSET)
